scope:
  manufacturer: Propellerheads
  model: Scream 4 Distortion
pages:
  Main:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }
    navigation:
      - { name: "Main", page: "Main", key: MixCc, min: 0, max: 1, input_type: Toggle }
    controls:
      SD: {name: speedDial, key: SpeedDialCc, target: Master Level, min: 0, max: 127, input_type: Value}
      SDB: {name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle}
      F: {name: fader, key: XfaderCcs, target: Damage Control, min: 0, max: 127, input_type: Value}
    encoders:
      E1: {name: encoder1, key: EncoderCcs, target: Parameter 1, min: 0, max: 127, input_type: Value}
      E2: {name: encoder2, key: EncoderCcs, target: Parameter 2, min: 0, max: 127, input_type: Value}
      E3: {name: encoder3, key: EncoderCcs, target: Damage Type, min: 0, max: 9, input_type: Value}
      E4: {name: encoder4, key: EncoderCcs, target: Cut Lo, min: -64, max: 63, input_type: Value}
      E5: {name: encoder5, key: EncoderCcs, target: Cut Mid, min: -64, max: 63, input_type: Value}
      E6: {name: encoder6, key: EncoderCcs, target: Cut Hi, min: -64, max: 63, input_type: Value}
    buttons:
      B1: {name: button1, key: ButtonCcs, target: Damage On/Off, min: 0, max: 1, input_type: Toggle}
      B2: {name: button2, key: ButtonCcs, target: Cut On/Off, min: 0, max: 1, input_type: Toggle}
      B3: {name: button3, key: ButtonCcs, target: Body On/Off, min: 0, max: 1, input_type: Toggle}