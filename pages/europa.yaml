scope:
  manufacturer: Propellerhead Software
  model: se.propellerheads.Europa

pages:

  OSC:

    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }

    navigation:
      - { name: OSC, page: OSC, key: MixCc, min: 0, max: 1, input_type: Toggle }
