scope:
  manufacturer: Propellerhead Software
  model: se.propellerheads.Europa
  display: Europa

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
#
# Europa has no master pan of its own beyond the device-wide Pan, so
# the Crossfader takes Pan, the Speed Dial the Master Volume and its
# click the device's Effect On.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: Master Volume, min: 0, max: 4194304, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Effect On, min: 0, max: 1, input_type: Toggle }
  F: { name: fader, key: XfaderCcs, target: Pan, min: 0, max: 4194304, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
#
#   1 OSC         the three oscillators
#   2 FILTER      the filter and the per-oscillator filter routings
#   3 MODULATION  the LFOs, the amp envelope and the mod matrix
#   4 FX          the distortion, phaser, delay, reverb, EQ and comp
pages:
  OSC:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Osc1 Wave, min: 0, max: 35, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Osc1 Shape, min: 0, max: 4194304, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Osc1 Harm Amt, min: 0, max: 4194304, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Osc1 Detune, min: 0, max: 4194304, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Osc1 Level, min: 0, max: 4194304, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Osc1 Pan, min: 0, max: 4194304, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Osc1 Tune, min: 0, max: 4194304, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Osc1 Semi, min: 0, max: 12, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Osc1 On, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Osc2 On, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Osc3 On, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Osc1 Unison On, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Osc2 Unison On, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: Osc3 Unison On, min: 0, max: 1, input_type: Toggle }
      B7: { name: button7, key: ButtonCcs, target: Osc1 Harm On, min: 0, max: 1, input_type: Toggle }
      B8: { name: button8, key: ButtonCcs, target: Osc1 SyncPhase, min: 0, max: 1, input_type: Toggle }
  FILTER:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Filter Freq, min: 0, max: 4194304, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Filter Reso, min: 0, max: 4194304, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Filter Drive, min: 0, max: 4194304, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Filter Kbd, min: 0, max: 4194304, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Filter Mod, min: 0, max: 4194304, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Filter Vel, min: 0, max: 4194304, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Filter Type, min: 0, max: 8, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Filter Mod Source, min: 0, max: 135, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Osc1 Filter On, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Osc2 Filter On, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Osc3 Filter On, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Osc1 To Filter, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Osc2 To Filter, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: Osc3 To Filter, min: 0, max: 1, input_type: Toggle }
  MODULATION:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: LFO 1 Rate, min: 0, max: 4194304, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: LFO 2 Rate, min: 0, max: 4194304, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: LFO 3 Rate, min: 0, max: 4194304, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Amp Attack, min: 0, max: 4194304, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Amp Decay, min: 0, max: 4194304, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Amp Sustain, min: 0, max: 4194304, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Amp Release, min: 0, max: 4194304, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Mod1 Source, min: 0, max: 32, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: LFO 1 KeySync, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: LFO 1 TempoSync, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: LFO 2 KeySync, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: LFO 2 TempoSync, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: LFO 3 KeySync, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: LFO 3 TempoSync, min: 0, max: 1, input_type: Toggle }
      B7: { name: button7, key: ButtonCcs, target: LFO 1 Global, min: 0, max: 1, input_type: Toggle }
      B8: { name: button8, key: ButtonCcs, target: LFO 2 Global, min: 0, max: 1, input_type: Toggle }
  FX:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Dist Drive, min: 0, max: 4194304, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Dist Amount, min: 0, max: 4194304, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Dist Tone, min: 0, max: 4194304, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Delay Time, min: 0, max: 4194304, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Delay Amount, min: 0, max: 4194304, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Reverb Size, min: 0, max: 4194304, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Reverb Amount, min: 0, max: 4194304, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: EQ Freq, min: 0, max: 4194304, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Dist On, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Phaser On, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Delay On, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Reverb On, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Eq On, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: Comp On, min: 0, max: 1, input_type: Toggle }
      B7: { name: button7, key: ButtonCcs, target: Delay Sync, min: 0, max: 1, input_type: Toggle }
      B8: { name: button8, key: ButtonCcs, target: Delay PingPong, min: 0, max: 1, input_type: Toggle }
