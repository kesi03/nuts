scope:
  manufacturer: Propellerheads
  model: The Echo
  display: The Echo

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: Delay Time, min: 0, max: 127, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle }
  F: { name: fader, key: XfaderCcs, target: Dry/Wet Balance, min: 0, max: 127, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Main:
    encoders:
      E2: { name: encoder2, key: EncoderCcs, target: Feedback, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Ping-Pong Pan, min: -64, max: 63, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Drive Amount, min: 0, max: 127, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Filter Frequency, min: 0, max: 127, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Filter Resonance, min: 0, max: 127, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: LFO Rate, min: 0, max: 127, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: LFO Amount, min: 0, max: 127, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Sync, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Keep Pitch, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Ping-Pong Mode, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Diffuse On, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Filter On, min: 0, max: 1, input_type: Toggle }
  Advanced:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Right Ch Time Offset, min: 0, max: 127, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Right Ch Feedback Offset, min: -64, max: 63, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Diffuse Spread, min: 0, max: 127, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Diffuse Amount, min: 0, max: 127, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Drive Type, min: 0, max: 3, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Envelope, min: -64, max: 63, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Wobble, min: 0, max: 127, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Input Mode, min: 0, max: 2, input_type: Value }
  Performance:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Roll Enabled, min: 0, max: 127, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Ducking, min: 0, max: 127, input_type: Value }
