scope:
  manufacturer: Propellerheads
  model: BV512 Digital Vocoder
  display: BV512

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: Dry/Wet, min: 0, max: 127, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle }
  F: { name: fader, key: XfaderCcs, target: HF Emphasis, min: 0, max: 127, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Main:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Band Count, min: 0, max: 4, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Shift, min: -64, max: 63, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Vocoder/Equalizer, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Hold, min: 0, max: 1, input_type: Toggle }
