scope:
  manufacturer: Groovy Melon
  model: com.groovymelon.MorfinXF
pages:
  Main:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }
    navigation:
      - { name: "Main", page: "Main", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Inputs", page: "Inputs", key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Mix", page: "Mix", key: InstrCc, min: 0, max: 1, input_type: Toggle }
    controls:
      SD: {name: speedDial, key: SpeedDialCc, target: Curve Type, min: 0, max: 9, input_type: Value}
      SDB: {name: speedDialButton, key: SpeedDialButtonCc, target: Phase Invert A, min: 0, max: 1, input_type: Toggle}
      F: {name: fader, key: XfaderCcs, target: Crossfader, min: 0, max: 4194304, input_type: Value}
    encoders:
      E1: {name: encoder1, key: EncoderCcs, target: Crossfader, min: 0, max: 4194304, input_type: Value}
      E2: {name: encoder2, key: EncoderCcs, target: Volume A, min: 0, max: 4194304, input_type: Value}
