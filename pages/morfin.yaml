scope:
  manufacturer: Groovy Melon
  model: com.groovymelon.MorfinXF
  display: Morfin XF

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: Curve Type, min: 0, max: 9, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Phase Invert A, min: 0, max: 1, input_type: Toggle }
  F: { name: fader, key: XfaderCcs, target: Crossfader, min: 0, max: 4194304, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Main:
    encoders:
      E2: { name: encoder2, key: EncoderCcs, target: Volume A, min: 0, max: 4194304, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Volume B, min: 0, max: 4194304, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Ch A Select Input, min: 0, max: 3, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Ch B Select Input, min: 0, max: 3, input_type: Value }
  Inputs:
    buttons:
      B2: { name: button2, key: ButtonCcs, target: Phase Invert B, min: 0, max: 1, input_type: Toggle }
