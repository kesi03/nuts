      E8: {name: encoder8, key: EncoderCcs, target: Phase Invert B, min: 0, max: 1, input_type: Toggle}
    buttons:
      B1: {name: button1, key: ButtonCcs, target: Phase Invert A, min: 0, max: 1, input_type: Toggle}
      B2: {name: button2, key: ButtonCcs, target: Phase Invert B, min: 0, max: 1, input_type: Toggle}
