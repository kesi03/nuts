scope:
  manufacturer: Propellerhead Software
  model: se.propellerheads.NoteEcho
  display: Note Echo

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: Velocity, min: 0, max: 4194304, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: On/Off, min: 0, max: 1, input_type: Toggle }
  F: { name: fader, key: XfaderCcs, target: Pitch, min: 0, max: 24, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Main:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Repeats, min: 0, max: 16, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Step Length Free, min: 0, max: 4194304, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Step Length Synced, min: 0, max: 16, input_type: Value }
    buttons:
      B2: { name: button2, key: ButtonCcs, target: Tempo Sync, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Original Note Enable, min: 0, max: 1, input_type: Toggle }
  Steps1to8:
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Step 1 Enable, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Step 2 Enable, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Step 3 Enable, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Step 4 Enable, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Step 5 Enable, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: Step 6 Enable, min: 0, max: 1, input_type: Toggle }
      B7: { name: button7, key: ButtonCcs, target: Step 7 Enable, min: 0, max: 1, input_type: Toggle }
      B8: { name: button8, key: ButtonCcs, target: Step 8 Enable, min: 0, max: 1, input_type: Toggle }
  Steps9to16:
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Step 9 Enable, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Step 10 Enable, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Step 11 Enable, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Step 12 Enable, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Step 13 Enable, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: Step 14 Enable, min: 0, max: 1, input_type: Toggle }
      B7: { name: button7, key: ButtonCcs, target: Step 15 Enable, min: 0, max: 1, input_type: Toggle }
      B8: { name: button8, key: ButtonCcs, target: Step 16 Enable, min: 0, max: 1, input_type: Toggle }
  Step17:
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Step 17 Enable, min: 0, max: 1, input_type: Toggle }
