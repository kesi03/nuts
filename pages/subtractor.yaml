scope:
  manufacturer: Propellerheads
  model: SubTractor Analog Synthesizer
  display: SubTractor

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: Filter Freq, min: 0, max: 127, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Osc2 On/Off, min: 0, max: 1, input_type: Toggle }
  F: { name: fader, key: XfaderCcs, target: Master Level, min: 0, max: 127, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Oscillators:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Osc1 Wave, min: 0, max: 31, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Osc1 Octave, min: 0, max: 9, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Osc1 Semitone, min: 0, max: 12, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Osc1 Fine Tune, min: -50, max: 50, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Osc2 Wave, min: 0, max: 31, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Osc2 Octave, min: 0, max: 9, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Osc2 Semitone, min: 0, max: 12, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Osc Mix, min: 0, max: 127, input_type: Value }
    buttons:
      B2: { name: button2, key: ButtonCcs, target: Ring Mod, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Noise On/Off, min: 0, max: 1, input_type: Toggle }
  Filter:
    encoders:
      E2: { name: encoder2, key: EncoderCcs, target: Filter Res, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Filter Type, min: 0, max: 4, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Filter Kbd Track, min: 0, max: 127, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Filter2 Freq, min: 0, max: 127, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Filter2 Res, min: 0, max: 127, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Filter Env Amount, min: 0, max: 127, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Filter Env Vel Amount, min: -64, max: 63, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Filter2 On/Off, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Filter Link Freq On/Off, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Filter Env Invert, min: 0, max: 1, input_type: Toggle }
  Envelopes:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Filter Env Attack, min: 0, max: 127, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Filter Env Decay, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Filter Env Sustain, min: 0, max: 127, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Filter Env Release, min: 0, max: 127, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Amp Env Attack, min: 0, max: 127, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Amp Env Decay, min: 0, max: 127, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Amp Env Sustain, min: 0, max: 127, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Amp Env Release, min: 0, max: 127, input_type: Value }
  Modulation:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: LFO1 Rate, min: 0, max: 127, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: LFO1 Amount, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: LFO1 Wave, min: 0, max: 5, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: LFO1 Dest, min: 0, max: 5, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: LFO2 Rate, min: 0, max: 127, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: LFO2 Amount, min: 0, max: 127, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: LFO2 Delay, min: 0, max: 127, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: FM Amount, min: 0, max: 127, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Mod Env Invert, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: LFO Sync Enable, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Key Mode, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Low Bandwidth On/Off, min: 0, max: 1, input_type: Toggle }
