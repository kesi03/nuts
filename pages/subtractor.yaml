scope:
  manufacturer: Propellerheads
  model: SubTractor Analog Synthesizer

pages:

  Oscillators:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }

    navigation:
      - { name: "Oscillators", page: "Oscillators", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Filter", page: "Filter", key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Envelopes", page: "Envelopes", key: InstrCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Modulation", page: "Modulation", key: LearnCc, min: 0, max: 1, input_type: Toggle }

    controls:
      SD:  { name: speedDial, key: SpeedDialCc, target: Filter Freq, min: 0, max: 127, input_type: Value }
      SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Osc2 On/Off, min: 0, max: 1, input_type: Toggle }
      F:   { name: fader, key: XfaderCcs, target: Master Level, min: 0, max: 127, input_type: Value }

    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Osc1 Wave, min: 0, max: 31, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Osc1 Octave, min: 0, max: 9, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Osc1 Semitone, min: 0, max: 12, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Osc1 Fine Tune, min: -50, max: 50, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Osc2 Wave, min: 0, max: 31, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Osc2 Octave, min: 0, max: 9, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Osc2 Semitone, min: 0, max: 12, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Osc Mix, min: 0, max: 127, input_type: Value }

    buttons:
      B1: { name: button1, key: ButtonCcs, target: Osc2 On/Off, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Ring Mod, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Noise On/Off, min: 0, max: 1, input_type: Toggle }

