scope:
  manufacturer: Propellerheads
  model: NN19 Digital Sampler
pages:
  Main:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }
    navigation:
      - { name: "Main", page: "Main", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Filter", page: "Filter", key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Envelope", page: "Envelope", key: InstrCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Performance", page: "Performance", key: LearnCc, min: 0, max: 1, input_type: Toggle }
    controls:
      SD: {name: speedDial, key: SpeedDialCc, target: Master Volume, min: 0, max: 127, input_type: Value}
      SDB: {name: speedDialButton, key: SpeedDialButtonCc, target: Solo Sample, min: 0, max: 1, input_type: Toggle}
      F: {name: fader, key: XfaderCcs, target: Stereo Spread, min: 0, max: 127, input_type: Value}
    encoders:
      E1: {name: encoder1, key: EncoderCcs, target: Sample Start, min: 0, max: 127, input_type: Value}
      E2: {name: encoder2, key: EncoderCcs, target: Filter Freq, min: 0, max: 127, input_type: Value}
