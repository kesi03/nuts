      E6: {name: encoder6, key: EncoderCcs, target: LFO Amount, min: 0, max: 127, input_type: Value}
      E7: {name: encoder7, key: EncoderCcs, target: Stereo Spread, min: 0, max: 127, input_type: Value}
      E8: {name: encoder8, key: EncoderCcs, target: Master Level, min: 0, max: 127, input_type: Value}
    buttons:
      B1: {name: button1, key: ButtonCcs, target: Filter On/Off, min: 0, max: 1, input_type: Toggle}
