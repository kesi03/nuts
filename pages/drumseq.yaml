scope:
  manufacturer: Propellerhead Software
  model: se.propellerheads.DrumSeq
  display: Drum Sequence

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
controls:
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Play, min: 0, max: 1, input_type: Toggle }
  F: { name: fader, key: XfaderCcs, target: Pattern Select, min: -1, max: 7, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Transport:
    buttons:
      B3: { name: button3, key: ButtonCcs, target: Record, min: 0, max: 1, input_type: Toggle }
  Lanes1:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Key1, min: 0, max: 127, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Key2, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Key3, min: 0, max: 127, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Key4, min: 0, max: 127, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Shuffle 1, min: 0, max: 128, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Shuffle 2, min: 0, max: 128, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Shuffle 3, min: 0, max: 128, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Shuffle 4, min: 0, max: 128, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Mute1, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Mute2, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Mute3, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Mute4, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Solo1, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: Solo2, min: 0, max: 1, input_type: Toggle }
      B7: { name: button7, key: ButtonCcs, target: Solo3, min: 0, max: 1, input_type: Toggle }
      B8: { name: button8, key: ButtonCcs, target: Solo4, min: 0, max: 1, input_type: Toggle }
  Lanes2:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Key5, min: 0, max: 127, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Key6, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Key7, min: 0, max: 127, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Key8, min: 0, max: 127, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Shuffle 5, min: 0, max: 128, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Shuffle 6, min: 0, max: 128, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Shuffle 7, min: 0, max: 128, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Shuffle 8, min: 0, max: 128, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Mute5, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Mute6, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Mute7, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Mute8, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Solo5, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: Solo6, min: 0, max: 1, input_type: Toggle }
      B7: { name: button7, key: ButtonCcs, target: Solo7, min: 0, max: 1, input_type: Toggle }
      B8: { name: button8, key: ButtonCcs, target: Solo8, min: 0, max: 1, input_type: Toggle }
  Reset:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Reset 1, min: 0, max: 128, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Reset 2, min: 0, max: 128, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Reset 3, min: 0, max: 128, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Reset 4, min: 0, max: 128, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Reset 5, min: 0, max: 128, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Reset 6, min: 0, max: 128, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Reset 7, min: 0, max: 128, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Reset 8, min: 0, max: 128, input_type: Value }
