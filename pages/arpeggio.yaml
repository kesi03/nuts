scope:
  manufacturer: Propellerhead Software
  model: se.propellerheads.Arpeggio
pages:
  Main:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }
    navigation:
      - { name: "Main", page: "Main", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Arp1", page: "Arp1", key: UserCc, min: 0, max: 1, input_type: Toggle }
    controls:
      SD: {name: speedDial, key: SpeedDialCc, target: Rate 1, min: 0, max: 20, input_type: Value}
      SDB: {name: speedDialButton, key: SpeedDialButtonCc, target: 'On', min: 0, max: 1, input_type: Toggle}
      F: {name: fader, key: XfaderCcs, target: Gate Length 1, min: 0, max: 4194304, input_type: Value}
    encoders:
      E1: {name: encoder1, key: EncoderCcs, target: Rate 1, min: 0, max: 20, input_type: Value}
      E2: {name: encoder2, key: EncoderCcs, target: Octaves 1, min: 0, max: 3, input_type: Value}
      E3: {name: encoder3, key: EncoderCcs, target: Direction 1, min: 0, max: 3, input_type: Value}
      E4: {name: encoder4, key: EncoderCcs, target: Gate Length 1, min: 0, max: 4194304, input_type: Value}
      E5: {name: encoder5, key: EncoderCcs, target: Rate 2, min: 0, max: 20, input_type: Value}
      E7: {name: encoder7, key: EncoderCcs, target: Direction 2, min: 0, max: 3, input_type: Value}
      E8: {name: encoder8, key: EncoderCcs, target: Gate Length 2, min: 0, max: 4194304, input_type: Value}
    buttons:
      B1: {name: button1, key: ButtonCcs, target: 'On', min: 0, max: 1, input_type: Toggle}
      B2: {name: button2, key: ButtonCcs, target: Hold, min: 0, max: 1, input_type: Toggle}
      B3: {name: button3, key: ButtonCcs, target: Arpeggio On 1, min: 0, max: 1, input_type: Toggle}
      B4: {name: button4, key: ButtonCcs, target: Arpeggio On 2, min: 0, max: 1, input_type: Toggle}
      B5: {name: button5, key: ButtonCcs, target: Repeat 1, min: 0, max: 1, input_type: Toggle}
      B6: {name: button6, key: ButtonCcs, target: Repeat 2, min: 0, max: 1, input_type: Toggle}
      B7: {name: button7, key: ButtonCcs, target: Pattern On 1, min: 0, max: 1, input_type: Toggle}
      B8: {name: button8, key: ButtonCcs, target: Pattern On 2, min: 0, max: 1, input_type: Toggle}
  Arp1:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }
    navigation:
      - { name: "Main", page: "Main", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Arp1", page: "Arp1", key: UserCc, min: 0, max: 1, input_type: Toggle }
    controls:
      SD: {name: speedDial, key: SpeedDialCc, target: Rate 1, min: 0, max: 20, input_type: Value}
      SDB: {name: speedDialButton, key: SpeedDialButtonCc, target: 'On', min: 0, max: 1, input_type: Toggle}
      F: {name: fader, key: XfaderCcs, target: Gate Length 1, min: 0, max: 4194304, input_type: Value}
    encoders:
      E1: {name: encoder1, key: EncoderCcs, target: Low Key 1, min: 0, max: 127, input_type: Value}
      E2: {name: encoder2, key: EncoderCcs, target: High Key 1, min: 0, max: 127, input_type: Value}
      E3: {name: encoder3, key: EncoderCcs, target: Rate 1, min: 0, max: 20, input_type: Value}
      E4: {name: encoder4, key: EncoderCcs, target: Octaves 1, min: 0, max: 3, input_type: Value}
      E5: {name: encoder5, key: EncoderCcs, target: Direction 1, min: 0, max: 3, input_type: Value}
    buttons:
      B1: {name: button1, key: ButtonCcs, target: Arpeggio On 1, min: 0, max: 1, input_type: Toggle}
      B2: {name: button2, key: ButtonCcs, target: 'Repeat 1', min: 0, max: 1, input_type: Toggle}
      B3: {name: button3, key: ButtonCcs, target: Arp Steps On 1, min: 0, max: 1, input_type: Toggle}
      B4: {name: button4, key: ButtonCcs, target: Pattern On 1, min: 0, max: 1, input_type: Toggle}
      B5: {name: button5, key: ButtonCcs, target: Velocity On 1, min: 0, max: 1, input_type: Toggle}
