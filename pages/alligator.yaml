    navigation:
      - { name: "Pattern", page: "Pattern", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Filters", page: "Filters", key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Modulation", page: "Modulation", key: InstrCc, min: 0, max: 1, input_type: Toggle }
      - { name: "FXMix", page: "FXMix", key: LearnCc, min: 0, max: 1, input_type: Toggle }

