      E5: { name: encoder5, key: EncoderCcs, target: Low Pass Env Amount, min: -64, max: 63, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Low Pass LFO Amount, min: -64, max: 63, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: LFO Freq, min: 0, max: 127, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: LFO Waveform, min: 0, max: 8, input_type: Value }

    buttons: {}

  FXMix:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
