scope:
  manufacturer: Propellerheads
  model: Alligator
  display: Alligator

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
controls:
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle }
  F: { name: fader, key: XfaderCcs, target: Master Volume, min: 0, max: 127, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Pattern:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Pattern, min: 0, max: 63, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Shift, min: 0, max: 32, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Resolution, min: 0, max: 4, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Amp Env Attack, min: 0, max: 127, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Amp Env Decay, min: 0, max: 127, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Amp Env Release, min: 0, max: 127, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Pattern Enable, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Shuffle, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: LFOSync, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: DelaySync, min: 0, max: 1, input_type: Toggle }
  Filters:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: High Pass Frequency, min: 0, max: 127, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: High Pass Resonance, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Band Pass Frequency, min: 0, max: 127, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Band Pass Resonance, min: 0, max: 127, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Low Pass Frequency, min: 0, max: 127, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Low Pass Resonance, min: 0, max: 127, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Filter Env Attack, min: 0, max: 127, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Filter Env Decay, min: 0, max: 127, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: High Pass Filter On, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Band Pass Filter On, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Low Pass Filter On, min: 0, max: 1, input_type: Toggle }
  Modulation:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: High Pass Env Amount, min: -64, max: 63, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: High Pass LFO Amount, min: -64, max: 63, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Band Pass Env Amount, min: -64, max: 63, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Band Pass LFO Amount, min: -64, max: 63, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Low Pass Env Amount, min: -64, max: 63, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Low Pass LFO Amount, min: -64, max: 63, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: LFO Freq, min: 0, max: 127, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: LFO Waveform, min: 0, max: 8, input_type: Value }
  FXMix:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: High Pass Drive Amount, min: 0, max: 127, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: High Pass Phaser Amount, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Band Pass Drive Amount, min: 0, max: 127, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Band Pass Phaser Amount, min: 0, max: 127, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: High Pass Volume, min: 0, max: 127, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: High Pass Pan, min: -64, max: 63, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Band Pass Volume, min: 0, max: 127, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Band Pass Pan, min: -64, max: 63, input_type: Value }
