      SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle }
      F:   { name: fader, key: XfaderCcs, target: Master Volume, min: 0, max: 127, input_type: Value }

    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: High Pass Frequency, min: 0, max: 127, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: High Pass Resonance, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Band Pass Frequency, min: 0, max: 127, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Band Pass Resonance, min: 0, max: 127, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Low Pass Frequency, min: 0, max: 127, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Low Pass Resonance, min: 0, max: 127, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Filter Env Attack, min: 0, max: 127, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Filter Env Decay, min: 0, max: 127, input_type: Value }

    buttons:
      B1: { name: button1, key: ButtonCcs, target: High Pass Filter On, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Band Pass Filter On, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Low Pass Filter On, min: 0, max: 1, input_type: Toggle }

  Modulation:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }

