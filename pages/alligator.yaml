      E2: { name: encoder2, key: EncoderCcs, target: High Pass LFO Amount, min: -64, max: 63, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Band Pass Env Amount, min: -64, max: 63, input_type: Value }
