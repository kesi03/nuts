scope:
  manufacturer: Propellerheads
  model: Alligator

pages:

  Pattern:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }

    navigation:
      - { name: "Pattern", page: "Pattern", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Filters", page: "Filters", key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Modulation", page: "Modulation", key: InstrCc, min: 0, max: 1, input_type: Toggle }
      - { name: "FXMix", page: "FXMix", key: LearnCc, min: 0, max: 1, input_type: Toggle }

    controls:
      SD:  { name: speedDial, key: SpeedDialCc, target: Master Volume, min: 0, max: 127, input_type: Value }
      SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle }
      F:   { name: fader, key: XfaderCcs, target: Master Volume, min: 0, max: 127, input_type: Value }

    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Pattern, min: 0, max: 63, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Shift, min: 0, max: 32, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Resolution, min: 0, max: 4, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Shuffle, min: 0, max: 1, input_type: Toggle }
      E5: { name: encoder5, key: EncoderCcs, target: Amp Env Attack, min: 0, max: 127, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Amp Env Decay, min: 0, max: 127, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Amp Env Release, min: 0, max: 127, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Master Volume, min: 0, max: 127, input_type: Value }

    buttons:
      B1: { name: button1, key: ButtonCcs, target: Pattern Enable, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Shuffle, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: LFOSync, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: DelaySync, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Enabled, min: 0, max: 2, input_type: Value }

  Filters:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }

    navigation:
      - { name: "Pattern", page: "Pattern", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Filters", page: "Filters", key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Modulation", page: "Modulation", key: InstrCc, min: 0, max: 1, input_type: Toggle }
      - { name: "FXMix", page: "FXMix", key: LearnCc, min: 0, max: 1, input_type: Toggle }

    controls:
