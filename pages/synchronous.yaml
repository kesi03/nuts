scope:
  manufacturer: Propellerhead Software
  model: se.propellerheads.Synchronous
  display: Synchronous

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: DryWet, min: 0, max: 4194304, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 2, input_type: Value }
  F: { name: fader, key: XfaderCcs, target: Master Level, min: 0, max: 4194304, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Main:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Dist Amount, min: 0, max: 4194304, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Dist Character, min: 0, max: 4194304, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Filter Freq, min: 0, max: 4194304, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Filter Reso, min: 0, max: 4194304, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Delay  Amount, min: 0, max: 4194304, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Delay Feedback, min: 0, max: 4194304, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Reverb Amount, min: 0, max: 4194304, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Reverb Decay, min: 0, max: 4194304, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Dist On, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Filter On, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Delay On, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Reverb On, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Delay Keep Pitch, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: Delay Tempo Sync, min: 0, max: 1, input_type: Toggle }
      B7: { name: button7, key: ButtonCcs, target: Delay Ping Pong, min: 0, max: 1, input_type: Toggle }
      B8: { name: button8, key: ButtonCcs, target: Level InOut, min: 0, max: 1, input_type: Toggle }
  Advanced:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Dist Type, min: 0, max: 3, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Filter Type, min: 0, max: 3, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Filter Lag, min: 0, max: 4194304, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Delay Time, min: 0, max: 4194304, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Delay Synched Time, min: 0, max: 15, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Delay Pan, min: 0, max: 4194304, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Reverb Size, min: 0, max: 4194304, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Reverb Damp, min: 0, max: 4194304, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Dist Post Filter, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Delay Roll, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Delay SendReturn, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Reverb SendReturn, min: 0, max: 1, input_type: Toggle }
  Output:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Level, min: 0, max: 4194304, input_type: Value }
