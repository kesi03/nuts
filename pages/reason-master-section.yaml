scope:
  manufacturer: Propellerheads
  model: Reason Master Section

pages:
  Compressor:
    pager:
      - {
          name: pageMinus,
          key: PageMinusCc,
          direction: "-",
          min: 0,
          max: 1,
          input_type: Toggle,
        }
      - {
          name: pagePlus,
          key: PagePlusCc,
          direction: "+",
          min: 0,
          max: 1,
          input_type: Toggle,
        }
    navigation:
      - {
          name: Compressor,
          page: Compressor,
          key: MixCc,
          min: 0,
          max: 1,
          input_type: Toggle,
        }
      - {
          name: ControlRoom,
          page: ControlRoom,
          key: UserCc,
          min: 0,
          max: 1,
          input_type: Toggle,
        }
      - {
          name: InternFx,
          page: InternFx,
          key: InstrCc,
          min: 0,
          max: 1,
          input_type: Toggle,
        }
      - {
          name: Fx,
          page: Fx,
          key: FXCc,
          min: 0,
          max: 1,
          input_type: Toggle,
        }
    controls:
      SD:
        {
          name: speedDial,
          key: SpeedDialCc,
          target: Master Level,
          min: 0,
          max: 1000,
          input_type: Value,
        }
      SDB:
        {
          name: speedDialButton,
          key: SpeedDialButtonCc,
          target: All Solo Off,
          min: 0,
          max: 1,
          input_type: Toggle,
        }
      F:
        {
          name: fader,
          key: XfaderCcs,
          target: Ctrl Room Level,
          min: -100,
          max: 100,
          input_type: Value,
        }

    encoders:
      E1:
        {
          name: encoder1,
          key: EncoderCcs,
          target: Threshold,
          min: 0,
          max: 127,
          input_type: Value,
        }
      E2:
        {
          name: encoder2,
          key: EncoderCcs,
          target: Ratio,
          min: 0,
          max: 2,
          input_type: Value,
        }
      E3:
        {
          name: encoder3,
          key: EncoderCcs,
          target: Attack,
          min: 0,
          max: 5,
          input_type: Value,
        }
      E4:
        {
          name: encoder4,
          key: EncoderCcs,
          target: Release,
          min: 0,
          max: 4,
          input_type: Value,
        }
      E5:
        {
          name: encoder5,
          key: EncoderCcs,
          target: Make-Up Gain,
          min: 0,
          max: 127,
          input_type: Value,
        }
    buttons:
      B1:
        {
          name: button1,
          key: ButtonCcs,
          target: Compressor On,
          min: 0,
          max: 1,
          input_type: Toggle,
        }
      B2:
        {
          name: button2,
