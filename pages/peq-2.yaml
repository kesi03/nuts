scope:
  manufacturer: Propellerheads
  model: PEQ-2 Two Band Parametric EQ
pages:
  Main:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }
    navigation:
      - { name: "Main", page: "Main", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "FilterA", page: "FilterA", key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: "FilterB", page: "FilterB", key: InstrCc, min: 0, max: 1, input_type: Toggle }
    controls:
      SD: {name: speedDial, key: SpeedDialCc, target: Filter A Gain, min: -64, max: 63, input_type: Value}
      SDB: {name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle}
      F: {name: fader, key: XfaderCcs, target: Filter B Gain, min: -64, max: 63, input_type: Value}
    encoders:
      E1: {name: encoder1, key: EncoderCcs, target: Filter A Freq, min: 0, max: 127, input_type: Value}
      E2: {name: encoder2, key: EncoderCcs, target: Filter A Q, min: 0, max: 127, input_type: Value}
      E3: {name: encoder3, key: EncoderCcs, target: Filter A Gain, min: -64, max: 63, input_type: Value}
      E4: {name: encoder4, key: EncoderCcs, target: Filter B Freq, min: 0, max: 127, input_type: Value}
      E5: {name: encoder5, key: EncoderCcs, target: Filter B Q, min: 0, max: 127, input_type: Value}
      E6: {name: encoder6, key: EncoderCcs, target: Filter B Gain, min: -64, max: 63, input_type: Value}
      E7: {name: encoder7, key: EncoderCcs, target: Enabled, min: 0, max: 2, input_type: Value}
      E8: {name: encoder8, key: EncoderCcs, target: Filter B On/Off, min: 0, max: 1, input_type: Toggle}
    buttons:
      B1: {name: button1, key: ButtonCcs, target: Filter B On/Off, min: 0, max: 1, input_type: Toggle}
      B2: {name: button2, key: ButtonCcs, target: Enabled, min: 0, max: 2, input_type: Value}
  FilterA:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }
    navigation:
      - { name: "Main", page: "Main", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "FilterA", page: "FilterA", key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: "FilterB", page: "FilterB", key: InstrCc, min: 0, max: 1, input_type: Toggle }
    controls:
      SD: {name: speedDial, key: SpeedDialCc, target: Filter A Gain, min: -64, max: 63, input_type: Value}
      SDB: {name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle}
      F: {name: fader, key: XfaderCcs, target: Filter B Gain, min: -64, max: 63, input_type: Value}
    encoders:
      E1: {name: encoder1, key: EncoderCcs, target: Filter A Freq, min: 0, max: 127, input_type: Value}
      E2: {name: encoder2, key: EncoderCcs, target: Filter A Q, min: 0, max: 127, input_type: Value}
      E3: {name: encoder3, key: EncoderCcs, target: Filter A Gain, min: -64, max: 63, input_type: Value}
    buttons: {}
  FilterB:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }
    navigation:
      - { name: "Main", page: "Main", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "FilterA", page: "FilterA", key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: "FilterB", page: "FilterB", key: InstrCc, min: 0, max: 1, input_type: Toggle }
    controls:
      SD: {name: speedDial, key: SpeedDialCc, target: Filter A Gain, min: -64, max: 63, input_type: Value}
      SDB: {name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle}
      F: {name: fader, key: XfaderCcs, target: Filter B Gain, min: -64, max: 63, input_type: Value}
    encoders:
      E1: {name: encoder1, key: EncoderCcs, target: Filter B Freq, min: 0, max: 127, input_type: Value}
      E2: {name: encoder2, key: EncoderCcs, target: Filter B Q, min: 0, max: 127, input_type: Value}
      E3: {name: encoder3, key: EncoderCcs, target: Filter B Gain, min: -64, max: 63, input_type: Value}
    buttons:
      B1: {name: button1, key: ButtonCcs, target: Filter B On/Off, min: 0, max: 1, input_type: Toggle}
