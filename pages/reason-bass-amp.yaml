scope:
  manufacturer: Propellerhead Software
  model: se.propellerheads.ReasonBassAmp
  display: Bass Amp

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: Drive, min: 0, max: 4194304, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 2, input_type: Value }
  F: { name: fader, key: XfaderCcs, target: Volume, min: 0, max: 4194304, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Main:
    encoders:
      E2: { name: encoder2, key: EncoderCcs, target: Bass, min: 0, max: 4194304, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Middle, min: 0, max: 4194304, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Treble, min: 0, max: 4194304, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Amp Switch, min: 0, max: 2, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Cab Switch, min: 0, max: 3, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Mid Freq, min: 0, max: 4, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Ultra Lo, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Ultra Hi, min: 0, max: 1, input_type: Toggle }
