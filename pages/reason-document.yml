scope:
  manufacturer: Propellerheads
  model: Reason Document

pages:
  Transport:
    pager:
      - {
          name: pageMinus,
          key: PageMinusCc,
          direction: "-",
          min: 0,
          max: 1,
          input_type: Toggle,
        }
      - {
          name: pagePlus,
          key: PagePlusCc,
          direction: "+",
          min: 0,
          max: 1,
          input_type: Toggle,
        }
    navigation:
      - {
          name: Transport,
          page: Transport,
          key: MixCc,
          min: 0,
          max: 1,
          input_type: Toggle,
        }
      - {
          name: Navigation,
          page: Navigation,
          key: UserCc,
          min: 0,
          max: 1,
          input_type: Toggle,
        }
      - {
          name: Loop,
          page: Loop,
          key: InstrCc,
          min: 0,
          max: 1,
          input_type: Toggle,
        }
      - {
          name: Track,
          page: Track,
          key: FXCc,
          min: 0,
          max: 1,
          input_type: Toggle,
        }
    controls:
      SD:
        {
          name: speedDial,
          key: SpeedDialCc,
          target: Tempo BPM,
          min: 0,
          max: 1000,
          input_type: Value,
        }
