          target: Tempo Decimal,
          min: 0,
          max: 999,
          input_type: Value,
        }
      E3:
        {
          name: encoder3,
          key: EncoderCcs,
          target: Bar Position,
          min: 0,
          max: 0,
          input_type: Delta,
        }
      E4:
        {
          name: encoder4,
          key: EncoderCcs,
          target: Beat Position,
          min: 0,
          max: 0,
          input_type: Delta,
        }
      E5:
        {
          name: encoder5,
          key: EncoderCcs,
          target: Tick Position,
          min: 0,
          max: 0,
          input_type: Delta,
        }
      E6:
        {
          name: encoder6,
          key: EncoderCcs,
          target: Song Position,
          min: 0,
          max: 2147483646,
          input_type: Value,
        }
      E7:
        {
          name: encoder7,
          key: EncoderCcs,
          target: Left Loop,
          min: 0,
          max: 2147483646,
          input_type: Value,
        }
      E8:
        {
          name: encoder8,
          key: EncoderCcs,
          target: Right Loop,
          min: 0,
          max: 2147483646,
          input_type: Value,
        }
    buttons:
      B1:
        {
          name: button1,
          key: ButtonCcs,
          target: Play,
          min: 0,
          max: 1,
          input_type: Trig,
        }
      B2:
        {
          name: button2,
          key: ButtonCcs,
          target: Stop,
          min: 0,
          max: 1,
          input_type: Trig,
        }
      B3:
