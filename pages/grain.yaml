scope:
  manufacturer: Propellerhead Software
  model: se.propellerheads.Grain
  display: Grain

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: Master Volume, min: 0, max: 4194304, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Effect On, min: 0, max: 1, input_type: Toggle }
  F: { name: fader, key: XfaderCcs, target: Speed, min: 0, max: 4194304, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Grain:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Position, min: 0, max: 4194304, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: End Pos, min: 0, max: 4194304, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Jitter, min: 0, max: 4194304, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Motion, min: 0, max: 5, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Grain Length, min: 0, max: 4194304, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Rate-Spacing, min: 0, max: 4194304, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Global Position, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Osc On, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Sample To Filter, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Osc To Filter, min: 0, max: 1, input_type: Toggle }
  Oscillator:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Algorithm, min: 0, max: 3, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Oct, min: 0, max: 4, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Semi, min: 0, max: 12, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Tune, min: 0, max: 4194304, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Formant, min: 0, max: 4194304, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Formant Tune, min: 0, max: 4194304, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Osc Mod, min: 0, max: 4194304, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Osc Level, min: 0, max: 4194304, input_type: Value }
  FilterAmp:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Filter Freq, min: 0, max: 4194304, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Filter Reso, min: 0, max: 4194304, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Filter Type, min: 0, max: 3, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Filter Env2, min: 0, max: 4194304, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Amp Attack, min: 0, max: 4194304, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Amp Decay, min: 0, max: 4194304, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Amp Sustain, min: 0, max: 4194304, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Amp Release, min: 0, max: 4194304, input_type: Value }
  Effects:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Dist Drive, min: 0, max: 4194304, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Dist Amount, min: 0, max: 4194304, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Delay Amount, min: 0, max: 4194304, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Delay FB, min: 0, max: 4194304, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Reverb Amount, min: 0, max: 4194304, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Reverb Size, min: 0, max: 4194304, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Comp Threshold, min: 0, max: 4194304, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Comp Ratio, min: 0, max: 4194304, input_type: Value }
    buttons:
      B2: { name: button2, key: ButtonCcs, target: Delay On, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Reverb On, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Dist On, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Phaser On, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: Comp On, min: 0, max: 1, input_type: Toggle }
