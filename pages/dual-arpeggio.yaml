scope:
  manufacturer: Propellerhead Software
  model: se.propellerheads.Arpeggio
  display: Dual Arpeggio

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
#
# The Dual Arpeggio runs two arpeggiators, and every parameter comes in
# a "1" and a "2" flavour. The two pages below are therefore the two
# arpeggiators, and the shared controls take the ones that are worth
# having under the hand all the time: the Speed Dial is the rate of
# arpeggiator 1, its click is the device's global On, and the
# Crossfader is the gate length.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: Rate 1, min: 0, max: 20, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: On, min: 0, max: 1, input_type: Toggle }
  F: { name: fader, key: XfaderCcs, target: Gate Length 1, min: 0, max: 4194304, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Arp 1:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Octaves 1, min: 0, max: 3, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Direction 1, min: 0, max: 3, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Transpose 1, min: 0, max: 48, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Low Key 1, min: 0, max: 127, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: High Key 1, min: 0, max: 127, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Shift Step 1, min: 0, max: 32, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Arp Steps 1, min: 0, max: 16, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Arpeggio On 1, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Repeat 1, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Pattern On 1, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Arp Steps On 1, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Velocity On 1, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: Hold, min: 0, max: 1, input_type: Toggle }
  Arp 2:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Rate 2, min: 0, max: 20, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Octaves 2, min: 0, max: 3, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Direction 2, min: 0, max: 3, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Gate Length 2, min: 0, max: 4194304, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Transpose 2, min: 0, max: 48, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Low Key 2, min: 0, max: 127, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: High Key 2, min: 0, max: 127, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Shift Step 2, min: 0, max: 32, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Arpeggio On 2, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Repeat 2, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Pattern On 2, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Arp Steps On 2, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Velocity On 2, min: 0, max: 1, input_type: Toggle }
