scope:
  manufacturer: Propellerheads
  model: MClass Maximizer
pages:
  Main:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }
    navigation:
      - { name: "Main", page: "Main", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Limiter", page: "Limiter", key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: "SoftClip", page: "SoftClip", key: InstrCc, min: 0, max: 1, input_type: Toggle }
    controls:
      SD: {name: speedDial, key: SpeedDialCc, target: Input Gain, min: 0, max: 127, input_type: Value}
      SDB: {name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle}
      F: {name: fader, key: XfaderCcs, target: Output Gain, min: 0, max: 127, input_type: Value}
    encoders:
      E1: {name: encoder1, key: EncoderCcs, target: Input Gain, min: 0, max: 127, input_type: Value}
      E2: {name: encoder2, key: EncoderCcs, target: Attack Speed, min: 0, max: 2, input_type: Value}
      E3: {name: encoder3, key: EncoderCcs, target: Release Speed, min: 0, max: 2, input_type: Value}
      E4: {name: encoder4, key: EncoderCcs, target: Output Gain, min: 0, max: 127, input_type: Value}
      E5: {name: encoder5, key: EncoderCcs, target: Soft Clip Amount, min: 0, max: 127, input_type: Value}
      E6: {name: encoder6, key: EncoderCcs, target: Enabled, min: 0, max: 2, input_type: Value}
      E7: {name: encoder7, key: EncoderCcs, target: Limiter Enable, min: 0, max: 1, input_type: Toggle}
      E8: {name: encoder8, key: EncoderCcs, target: Soft Clip Enable, min: 0, max: 1, input_type: Toggle}
    buttons:
      B1: {name: button1, key: ButtonCcs, target: Limiter Enable, min: 0, max: 1, input_type: Toggle}
      B2: {name: button2, key: ButtonCcs, target: Look Ahead Enable, min: 0, max: 1, input_type: Toggle}
      B3: {name: button3, key: ButtonCcs, target: Soft Clip Enable, min: 0, max: 1, input_type: Toggle}
      B4: {name: button4, key: ButtonCcs, target: Output Level Meter Mode, min: 0, max: 1, input_type: Toggle}
      B5: {name: button5, key: ButtonCcs, target: Enabled, min: 0, max: 2, input_type: Value}
  Limiter:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }
    navigation:
      - { name: "Main", page: "Main", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Limiter", page: "Limiter", key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: "SoftClip", page: "SoftClip", key: InstrCc, min: 0, max: 1, input_type: Toggle }
    controls:
      SD: {name: speedDial, key: SpeedDialCc, target: Input Gain, min: 0, max: 127, input_type: Value}
      SDB: {name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle}
      F: {name: fader, key: XfaderCcs, target: Output Gain, min: 0, max: 127, input_type: Value}
    encoders:
      E1: {name: encoder1, key: EncoderCcs, target: Input Gain, min: 0, max: 127, input_type: Value}
      E2: {name: encoder2, key: EncoderCcs, target: Attack Speed, min: 0, max: 2, input_type: Value}
      E3: {name: encoder3, key: EncoderCcs, target: Release Speed, min: 0, max: 2, input_type: Value}
      E4: {name: encoder4, key: EncoderCcs, target: Output Gain, min: 0, max: 127, input_type: Value}
    buttons:
      B1: {name: button1, key: ButtonCcs, target: Limiter Enable, min: 0, max: 1, input_type: Toggle}
      B2: {name: button2, key: ButtonCcs, target: Look Ahead Enable, min: 0, max: 1, input_type: Toggle}
  SoftClip:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }
    navigation:
      - { name: "Main", page: "Main", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Limiter", page: "Limiter", key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: "SoftClip", page: "SoftClip", key: InstrCc, min: 0, max: 1, input_type: Toggle }
    controls:
      SD: {name: speedDial, key: SpeedDialCc, target: Input Gain, min: 0, max: 127, input_type: Value}
      SDB: {name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle}
      F: {name: fader, key: XfaderCcs, target: Output Gain, min: 0, max: 127, input_type: Value}
    encoders:
      E1: {name: encoder1, key: EncoderCcs, target: Soft Clip Amount, min: 0, max: 127, input_type: Value}
      E2: {name: encoder2, key: EncoderCcs, target: Input Gain, min: 0, max: 127, input_type: Value}
      E3: {name: encoder3, key: EncoderCcs, target: Output Gain, min: 0, max: 127, input_type: Value}
      E4: {name: encoder4, key: EncoderCcs, target: Enabled, min: 0, max: 2, input_type: Value}
    buttons:
      B1: {name: button1, key: ButtonCcs, target: Soft Clip Enable, min: 0, max: 1, input_type: Toggle}
      B2: {name: button2, key: ButtonCcs, target: Output Level Meter Mode, min: 0, max: 1, input_type: Toggle}
