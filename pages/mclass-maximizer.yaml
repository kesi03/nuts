scope:
  manufacturer: Propellerheads
  model: MClass Maximizer
  display: MC Maximizer

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: Input Gain, min: 0, max: 127, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle }
  F: { name: fader, key: XfaderCcs, target: Output Gain, min: 0, max: 127, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Main:
    encoders:
      E2: { name: encoder2, key: EncoderCcs, target: Attack Speed, min: 0, max: 2, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Release Speed, min: 0, max: 2, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Soft Clip Amount, min: 0, max: 127, input_type: Value }
    buttons:
      B2: { name: button2, key: ButtonCcs, target: Look Ahead Enable, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Output Level Meter Mode, min: 0, max: 1, input_type: Toggle }
  Limiter:
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Limiter Enable, min: 0, max: 1, input_type: Toggle }
  SoftClip:
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Soft Clip Enable, min: 0, max: 1, input_type: Toggle }
