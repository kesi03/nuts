scope:
  manufacturer: Propellerheads
  model: MClass Compressor
  display: MC Compressor

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: Input Gain, min: 0, max: 127, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle }
  F: { name: fader, key: XfaderCcs, target: Output Gain, min: 0, max: 127, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Main:
    encoders:
      E2: { name: encoder2, key: EncoderCcs, target: Threshold, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Ratio, min: 0, max: 127, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Attack, min: 0, max: 127, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Release, min: 0, max: 127, input_type: Value }
    buttons:
      B2: { name: button2, key: ButtonCcs, target: Sidechain Solo, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Adapt, min: 0, max: 1, input_type: Toggle }
  Dynamics:
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Soft Knee, min: 0, max: 1, input_type: Toggle }
