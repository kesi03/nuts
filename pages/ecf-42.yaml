scope:
  manufacturer: Propellerheads
  model: ECF-42 Envelope Controlled Filter
  display: ECF-42

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
#
# The ECF-42 is a single filter with one envelope, so it needs only one
# page: the Speed Dial is the filter frequency, its click is the
# device's Enabled state, and the Crossfader is the envelope amount.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: Frequency, min: 0, max: 127, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 2, input_type: Value }
  F: { name: fader, key: XfaderCcs, target: Env Amount, min: 0, max: 127, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Main:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Attack, min: 0, max: 127, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Decay, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Sustain, min: 0, max: 127, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Release, min: 0, max: 127, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Resonance, min: 0, max: 127, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Mode, min: 0, max: 2, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Velocity, min: 0, max: 127, input_type: Value }
