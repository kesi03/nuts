scope:
  manufacturer: Propellerheads
  model: Redrum Drum Computer
pages:
  Mixer:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }
    navigation:
      - { name: "Mixer", page: "Mixer", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Drum", page: "Drum", key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Sound", page: "Sound", key: InstrCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Pattern", page: "Pattern", key: LearnCc, min: 0, max: 1, input_type: Toggle }
    controls:
      SD: {name: speedDial, key: SpeedDialCc, target: Master Level, min: 0, max: 127, input_type: Value}
      SDB: {name: speedDialButton, key: SpeedDialButtonCc, target: Solo, min: 0, max: 1, input_type: Toggle}
      F: {name: fader, key: XfaderCcs, target: Pan, min: 0, max: 127, input_type: Value}
    encoders:
      E1: {name: encoder1, key: EncoderCcs, target: Drum 1 Level, min: 0, max: 127, input_type: Value}
      E2: {name: encoder2, key: EncoderCcs, target: Drum 2 Level, min: 0, max: 127, input_type: Value}
      E3: {name: encoder3, key: EncoderCcs, target: Drum 3 Level, min: 0, max: 127, input_type: Value}
      E4: {name: encoder4, key: EncoderCcs, target: Drum 4 Level, min: 0, max: 127, input_type: Value}
      E5: {name: encoder5, key: EncoderCcs, target: Drum 5 Level, min: 0, max: 127, input_type: Value}
      E6: {name: encoder6, key: EncoderCcs, target: Drum 6 Level, min: 0, max: 127, input_type: Value}
      E7: {name: encoder7, key: EncoderCcs, target: Drum 7 Level, min: 0, max: 127, input_type: Value}
      E8: {name: encoder8, key: EncoderCcs, target: Drum 8 Level, min: 0, max: 127, input_type: Value}
    buttons:
      B1: {name: button1, key: ButtonCcs, target: Drum 1 Mute, min: 0, max: 1, input_type: Toggle}
      B2: {name: button2, key: ButtonCcs, target: Drum 2 Mute, min: 0, max: 1, input_type: Toggle}
      B3: {name: button3, key: ButtonCcs, target: Drum 3 Mute, min: 0, max: 1, input_type: Toggle}
      B4: {name: button4, key: ButtonCcs, target: Drum 4 Mute, min: 0, max: 1, input_type: Toggle}
      B5: {name: button5, key: ButtonCcs, target: Drum 5 Mute, min: 0, max: 1, input_type: Toggle}
      B6: {name: button6, key: ButtonCcs, target: Drum 6 Mute, min: 0, max: 1, input_type: Toggle}
      B7: {name: button7, key: ButtonCcs, target: Drum 7 Mute, min: 0, max: 1, input_type: Toggle}
      B8: {name: button8, key: ButtonCcs, target: Drum 8 Mute, min: 0, max: 1, input_type: Toggle}
  Drum:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }
    navigation:
      - { name: "Mixer", page: "Mixer", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Drum", page: "Drum", key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Sound", page: "Sound", key: InstrCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Pattern", page: "Pattern", key: LearnCc, min: 0, max: 1, input_type: Toggle }
    controls:
      SD: {name: speedDial, key: SpeedDialCc, target: Master Level, min: 0, max: 127, input_type: Value}
      SDB: {name: speedDialButton, key: SpeedDialButtonCc, target: Solo, min: 0, max: 1, input_type: Toggle}
      F: {name: fader, key: XfaderCcs, target: Pan, min: 0, max: 127, input_type: Value}
    encoders:
      E1: {name: encoder1, key: EncoderCcs, target: Selected Drum, min: 1, max: 10, input_type: Value}
      E2: {name: encoder2, key: EncoderCcs, target: Level, input_type: Value, dynamic: true}
      E3: {name: encoder3, key: EncoderCcs, target: Pan, input_type: Value, dynamic: true}
      E4: {name: encoder4, key: EncoderCcs, target: Pitch, input_type: Value, dynamic: true}
      E5: {name: encoder5, key: EncoderCcs, target: Length, input_type: Value, dynamic: true}
      E6: {name: encoder6, key: EncoderCcs, target: Send 1 Amount, input_type: Value, dynamic: true}
      E7: {name: encoder7, key: EncoderCcs, target: Send 2 Amount, input_type: Value, dynamic: true}
      E8: {name: encoder8, key: EncoderCcs, target: Vel to Level, input_type: Value, dynamic: true}
    buttons:
      B1: {name: button1, key: ButtonCcs, target: Mute, input_type: Toggle, dynamic: true}
      B2: {name: button2, key: ButtonCcs, target: Solo, input_type: Toggle, dynamic: true}
      B3: {name: button3, key: ButtonCcs, target: Decay/Gate Mode, input_type: Toggle, dynamic: true}
  Sound:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }
    navigation:
      - { name: "Mixer", page: "Mixer", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Drum", page: "Drum", key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Sound", page: "Sound", key: InstrCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Pattern", page: "Pattern", key: LearnCc, min: 0, max: 1, input_type: Toggle }
    controls:
      SD: {name: speedDial, key: SpeedDialCc, target: Master Level, min: 0, max: 127, input_type: Value}
      SDB: {name: speedDialButton, key: SpeedDialButtonCc, target: Solo, min: 0, max: 1, input_type: Toggle}
      F: {name: fader, key: XfaderCcs, target: Pan, min: 0, max: 127, input_type: Value}
    encoders:
      E1: {name: encoder1, key: EncoderCcs, target: Selected Drum, min: 1, max: 10, input_type: Value}
      E2: {name: encoder2, key: EncoderCcs, target: Special Parameter, input_type: Value, dynamic: true}
      E3: {name: encoder3, key: EncoderCcs, target: Special Velocity Parameter, input_type: Value, dynamic: true}
      E4: {name: encoder4, key: EncoderCcs, target: Pan, input_type: Value, dynamic: true}
      E5: {name: encoder5, key: EncoderCcs, target: Pitch, input_type: Value, dynamic: true}
      E6: {name: encoder6, key: EncoderCcs, target: Length, input_type: Value, dynamic: true}
      E7: {name: encoder7, key: EncoderCcs, target: Send 1 Amount, input_type: Value, dynamic: true}
      E8: {name: encoder8, key: EncoderCcs, target: Send 2 Amount, input_type: Value, dynamic: true}
    buttons:
      B1: {name: button1, key: ButtonCcs, target: Mute, input_type: Toggle, dynamic: true}
      B2: {name: button2, key: ButtonCcs, target: Solo, input_type: Toggle, dynamic: true}
    dynamic_mapping:
      Drum1:
        parameter1: Drum 1 Tone
        parameter2: Drum 1 Vel to Tone
      Drum2:
        parameter1: Drum 2 Tone
        parameter2: Drum 2 Vel to Tone
      Drum3:
        parameter1: Drum 3 Sample Start
        parameter2: Drum 3 Vel to Sample Start
      Drum4:
        parameter1: Drum 4 Sample Start
        parameter2: Drum 4 Vel to Sample Start
      Drum5:
        parameter1: Drum 5 Sample Start
        parameter2: Drum 5 Vel to Sample Start
      Drum6:
        parameter1: Drum 6 Pitch Bend Amount
        parameter2: Drum 6 Vel to Pitch Bend
      Drum7:
        parameter1: Drum 7 Pitch Bend Amount
        parameter2: Drum 7 Vel to Pitch Bend
      Drum8:
        parameter1: Drum 8 Sample Start
        parameter2: Drum 8 Vel to Sample Start
      Drum9:
        parameter1: Drum 9 Sample Start
        parameter2: Drum 9 Vel to Sample Start
      Drum10:
        parameter1: Drum 10 Tone
        parameter2: Drum 10 Vel to Tone
  Pattern:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }
    navigation:
      - { name: "Mixer", page: "Mixer", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Drum", page: "Drum", key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Sound", page: "Sound", key: InstrCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Pattern", page: "Pattern", key: LearnCc, min: 0, max: 1, input_type: Toggle }
    controls:
      SD: {name: speedDial, key: SpeedDialCc, target: Master Level, min: 0, max: 127, input_type: Value}
      SDB: {name: speedDialButton, key: SpeedDialButtonCc, target: Solo, min: 0, max: 1, input_type: Toggle}
      F: {name: fader, key: XfaderCcs, target: Pan, min: 0, max: 127, input_type: Value}
    encoders:
      E1: {name: encoder1, key: EncoderCcs, target: Selected Pattern, min: -1, max: 31, input_type: Value}
      E2: {name: encoder2, key: EncoderCcs, target: Pattern Select in Bank, min: 0, max: 7, input_type: Value}
      E3: {name: encoder3, key: EncoderCcs, target: Bank Select, min: 0, max: 3, input_type: Value}
      E4: {name: encoder4, key: EncoderCcs, target: Resolution, min: 0, max: 8, input_type: Value}
      E5: {name: encoder5, key: EncoderCcs, target: Steps, min: 1, max: 64, input_type: Value}
      E6: {name: encoder6, key: EncoderCcs, target: Flam Amount, min: 0, max: 127, input_type: Value}
      E7: {name: encoder7, key: EncoderCcs, target: Edit Steps, min: 0, max: 3, input_type: Value}
      E8: {name: encoder8, key: EncoderCcs, target: Remote Start Step, min: 1, max: 64, input_type: Value}
    buttons:
      B1: {name: button1, key: ButtonCcs, target: Run, min: 0, max: 1, input_type: Toggle}
      B2: {name: button2, key: ButtonCcs, target: Pattern Enable, min: 0, max: 1, input_type: Toggle}
      B3: {name: button3, key: ButtonCcs, target: Enable Pattern Section Playback, min: 0, max: 1, input_type: Toggle}
      B4: {name: button4, key: ButtonCcs, target: Shuffle, min: 0, max: 1, input_type: Toggle}
      B5: {name: button5, key: ButtonCcs, target: Edit Flam, min: 0, max: 1, input_type: Toggle}
