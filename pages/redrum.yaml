scope:
  manufacturer: Propellerheads
  model: Redrum Drum Computer
  display: Redrum

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: Master Level, min: 0, max: 127, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Mixer:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Drum 1 Level, min: 0, max: 127, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Drum 2 Level, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Drum 3 Level, min: 0, max: 127, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Drum 4 Level, min: 0, max: 127, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Drum 5 Level, min: 0, max: 127, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Drum 6 Level, min: 0, max: 127, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Drum 7 Level, min: 0, max: 127, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Drum 8 Level, min: 0, max: 127, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Drum 1 Mute, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Drum 2 Mute, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Drum 3 Mute, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Drum 4 Mute, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Drum 5 Mute, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: Drum 6 Mute, min: 0, max: 1, input_type: Toggle }
      B7: { name: button7, key: ButtonCcs, target: Drum 7 Mute, min: 0, max: 1, input_type: Toggle }
      B8: { name: button8, key: ButtonCcs, target: Drum 8 Mute, min: 0, max: 1, input_type: Toggle }
  Drum:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Selected Drum, min: 1, max: 10, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Drum 1 Pan, input_type: Value, dynamic: true }
      E4: { name: encoder4, key: EncoderCcs, target: Drum 1 Pitch, input_type: Value, dynamic: true }
      E5: { name: encoder5, key: EncoderCcs, target: Drum 1 Length, input_type: Value, dynamic: true }
      E6: { name: encoder6, key: EncoderCcs, target: Drum 1 Send 1 Amount, input_type: Value, dynamic: true }
      E7: { name: encoder7, key: EncoderCcs, target: Drum 1 Send 2 Amount, input_type: Value, dynamic: true }
      E8: { name: encoder8, key: EncoderCcs, target: Drum 1 Vel to Level, input_type: Value, dynamic: true }
    buttons:
      B2: { name: button2, key: ButtonCcs, target: Drum 1 Solo, input_type: Toggle, dynamic: true }
      B3: { name: button3, key: ButtonCcs, target: Drum 1 Decay/Gate Mode, input_type: Toggle, dynamic: true }
  Pattern:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Selected Pattern, min: -1, max: 31, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Pattern Select in Bank, min: 0, max: 7, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Bank Select, min: 0, max: 3, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Resolution, min: 0, max: 8, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Steps, min: 1, max: 64, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Flam Amount, min: 0, max: 127, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Edit Steps, min: 0, max: 3, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Remote Start Step, min: 1, max: 64, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Run, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Pattern Enable, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Enable Pattern Section Playback, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Shuffle, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Edit Flam, min: 0, max: 1, input_type: Toggle }
