scope:
  manufacturer: Propellerhead Software
  model: se.propellerheads.ScalesAndChords
  display: Scales and Chords

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: Key, min: 0, max: 11, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: On/Off, min: 0, max: 1, input_type: Toggle }
  F: { name: fader, key: XfaderCcs, target: Scale, min: 0, max: 13, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Main:
    encoders:
      E3: { name: encoder3, key: EncoderCcs, target: Notes, min: 0, max: 4, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Inversion, min: 0, max: 4, input_type: Value }
    buttons:
      B2: { name: button2, key: ButtonCcs, target: Filter Notes, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Chords, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Open Chords, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Add Octave Up, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: Add Octave Down, min: 0, max: 1, input_type: Toggle }
  ChordTools:
    buttons:
      B4: { name: button4, key: ButtonCcs, target: Add Color, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Alter, min: 0, max: 1, input_type: Toggle }
