scope:
  manufacturer: Propellerheads
  model: DDL-1 Digital Delay Line
  display: DDL-1

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: "DelayTime (ms)", min: 1, max: 2000, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Unit, min: 0, max: 1, input_type: Toggle }
  F: { name: fader, key: XfaderCcs, target: Dry/Wet Balance, min: 0, max: 127, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Main:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Enabled, min: 0, max: 2, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: "DelayTime (steps)", min: 1, max: 16, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Feedback, min: 0, max: 127, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Pan, min: -64, max: 63, input_type: Value }
    buttons:
      B2: { name: button2, key: ButtonCcs, target: Step Length, min: 0, max: 1, input_type: Toggle }
