scope:
  manufacturer: Propellerhead Software
  model: se.propellerheads.Humana
  display: Humana

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: Master_Volume, min: 0, max: 4194304, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Reverb_On, min: 0, max: 1, input_type: Toggle }
  F: { name: fader, key: XfaderCcs, target: Octave, min: 0, max: 4, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Main:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Instrument, min: 0, max: 15, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: SampleStart, min: 0, max: 4194304, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Semitune, min: 0, max: 24, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Filter_Cutoff, min: 0, max: 4194304, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Filter_Reso, min: 0, max: 4194304, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Delay_Amount, min: 0, max: 4194304, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Reverb_Amount, min: 0, max: 4194304, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Filter_On, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Delay_On, min: 0, max: 1, input_type: Toggle }
  Filter:
    encoders:
      E3: { name: encoder3, key: EncoderCcs, target: Filter_Type, min: 0, max: 3, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Filter_Env, min: 0, max: 4194304, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Filter_KeyFollow, min: 0, max: 4194304, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Filter_Velocity, min: 0, max: 4194304, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Amp_Velocity, min: 0, max: 4194304, input_type: Value }
  Envelope:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Amp_Attack, min: 0, max: 4194304, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Amp_Decay, min: 0, max: 4194304, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Amp_Sustain, min: 0, max: 4194304, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Amp_Release, min: 0, max: 4194304, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Filter_Attack, min: 0, max: 4194304, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Filter_Decay, min: 0, max: 4194304, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Filter_Sustain, min: 0, max: 4194304, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Filter_Release, min: 0, max: 4194304, input_type: Value }
  Effects:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Delay_Time, min: 0, max: 4194304, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Synced_Delay_Time, min: 0, max: 11, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Delay_Feedback, min: 0, max: 4194304, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Delay_Damp, min: 0, max: 4194304, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Reverb_Time, min: 0, max: 4194304, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Reverb_PreDelay, min: 0, max: 4194304, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Reverb_HighDamp, min: 0, max: 4194304, input_type: Value }
    buttons:
      B2: { name: button2, key: ButtonCcs, target: Delay_Sync, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Delay_PingPong, min: 0, max: 1, input_type: Toggle }
