scope:
  manufacturer: Propellerheads
  model: Pulveriser

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: Volume, min: 0, max: 127, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle }
  F: { name: fader, key: XfaderCcs, target: Blend, min: 0, max: 127, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Main:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Squash, min: 0, max: 127, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Release, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Dirt, min: 0, max: 127, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Tone, min: 0, max: 127, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Filter Frequency, min: 0, max: 127, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Peak, min: 0, max: 127, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Routing, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Sync, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Tremor Spread, min: 0, max: 1, input_type: Toggle }
  Filter:
    encoders:
      E3: { name: encoder3, key: EncoderCcs, target: Filter Mode, min: 0, max: 5, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Tremor to Frequency, min: -64, max: 63, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Follower to Frequency, min: -64, max: 63, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Follower Threshold, min: 0, max: 127, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Follower Attack, min: 0, max: 127, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Follower Release, min: 0, max: 127, input_type: Value }
  Tremor:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Tremor Rate, min: 0, max: 127, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Tremor Waveform, min: 0, max: 8, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Tremor Lag, min: 0, max: 127, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Follower to Rate, min: -64, max: 63, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Tremor to Volume, min: -64, max: 63, input_type: Value }
