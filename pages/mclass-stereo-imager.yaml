scope:
  manufacturer: Propellerheads
  model: MClass Stereo Imager
  display: MC Imager

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: High Width, min: -64, max: 63, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle }
  F: { name: fader, key: XfaderCcs, target: Low Width, min: -64, max: 63, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Main:
    encoders:
      E3: { name: encoder3, key: EncoderCcs, target: X-Over Frequency, min: 0, max: 127, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Solo Mode, min: 0, max: 2, input_type: Value }
  Routing:
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Separate Out Mode, min: 0, max: 1, input_type: Toggle }
