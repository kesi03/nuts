scope:
  manufacturer: Propellerheads
  model: MClass Stereo Imager
pages:
  Main:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }
    navigation:
      - { name: "Main", page: "Main", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Width", page: "Width", key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Routing", page: "Routing", key: InstrCc, min: 0, max: 1, input_type: Toggle }
    controls:
      SD: {name: speedDial, key: SpeedDialCc, target: High Width, min: -64, max: 63, input_type: Value}
      SDB: {name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle}
      F: {name: fader, key: XfaderCcs, target: Low Width, min: -64, max: 63, input_type: Value}
    encoders:
      E1: {name: encoder1, key: EncoderCcs, target: Low Width, min: -64, max: 63, input_type: Value}
      E2: {name: encoder2, key: EncoderCcs, target: High Width, min: -64, max: 63, input_type: Value}
      E3: {name: encoder3, key: EncoderCcs, target: X-Over Frequency, min: 0, max: 127, input_type: Value}
      E4: {name: encoder4, key: EncoderCcs, target: Solo Mode, min: 0, max: 2, input_type: Value}
      E5: {name: encoder5, key: EncoderCcs, target: Enabled, min: 0, max: 2, input_type: Value}
      E6: {name: encoder6, key: EncoderCcs, target: Separate Out Mode, min: 0, max: 1, input_type: Toggle}
    buttons:
      B1: {name: button1, key: ButtonCcs, target: Separate Out Mode, min: 0, max: 1, input_type: Toggle}
      B2: {name: button2, key: ButtonCcs, target: Enabled, min: 0, max: 2, input_type: Value}
  Width:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }
    navigation:
      - { name: "Main", page: "Main", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Width", page: "Width", key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Routing", page: "Routing", key: InstrCc, min: 0, max: 1, input_type: Toggle }
    controls:
      SD: {name: speedDial, key: SpeedDialCc, target: High Width, min: -64, max: 63, input_type: Value}
      SDB: {name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle}
      F: {name: fader, key: XfaderCcs, target: Low Width, min: -64, max: 63, input_type: Value}
    encoders:
      E1: {name: encoder1, key: EncoderCcs, target: Low Width, min: -64, max: 63, input_type: Value}
      E2: {name: encoder2, key: EncoderCcs, target: High Width, min: -64, max: 63, input_type: Value}
      E3: {name: encoder3, key: EncoderCcs, target: X-Over Frequency, min: 0, max: 127, input_type: Value}
      E4: {name: encoder4, key: EncoderCcs, target: Solo Mode, min: 0, max: 2, input_type: Value}
    buttons: {}
  Routing:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }
    navigation:
      - { name: "Main", page: "Main", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Width", page: "Width", key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Routing", page: "Routing", key: InstrCc, min: 0, max: 1, input_type: Toggle }
    controls:
      SD: {name: speedDial, key: SpeedDialCc, target: High Width, min: -64, max: 63, input_type: Value}
      SDB: {name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle}
      F: {name: fader, key: XfaderCcs, target: Low Width, min: -64, max: 63, input_type: Value}
    encoders:
      E1: {name: encoder1, key: EncoderCcs, target: Solo Mode, min: 0, max: 2, input_type: Value}
      E2: {name: encoder2, key: EncoderCcs, target: X-Over Frequency, min: 0, max: 127, input_type: Value}
      E3: {name: encoder3, key: EncoderCcs, target: Low Width, min: -64, max: 63, input_type: Value}
      E4: {name: encoder4, key: EncoderCcs, target: High Width, min: -64, max: 63, input_type: Value}
    buttons:
      B1: {name: button1, key: ButtonCcs, target: Separate Out Mode, min: 0, max: 1, input_type: Toggle}
      B2: {name: button2, key: ButtonCcs, target: Enabled, min: 0, max: 2, input_type: Value}
