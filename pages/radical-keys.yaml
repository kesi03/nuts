scope:
  manufacturer: Propellerhead Software
  model: se.propellerheads.RadicalKeys
  display: Radical Keys

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
#
# The Speed Dial is the Character (the patch's character morph), its click
# selects the next patch (the scope's only trigger), and the Crossfader is
# the Master Volume.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: Character, min: 0, max: 38, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Select Next Patch, min: 0, max: 0, input_type: Trigger }
  F: { name: fader, key: XfaderCcs, target: Master Volume, min: 0, max: 4194304, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
#
#   1 Piano         the playing controls
#   2 Envelope      the amp envelope, the sympathetic resonance and the keys
#   3 FX            tremolo, chorus and phaser
#   4 Overdrive/EQ  the overdrive, the ambience and the three-band EQ
pages:
  Piano:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Instrument Blend, min: 0, max: 4194304, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Tune, min: 0, max: 4194304, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Tune Drift, min: 0, max: 4194304, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Vel Resp Curve, min: 0, max: 4194304, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Vel Resp Low, min: 0, max: 4194304, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Vel Resp High, min: 0, max: 4194304, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Sustain Pedal, min: 0, max: 127, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: mic1, min: 0, max: 8, input_type: Value }
  Envelope:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Env Attack, min: 0, max: 4194304, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Env Decay Curve, min: 0, max: 4194304, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Env Release, min: 0, max: 4194304, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Symp Res Level, min: 0, max: 4194304, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Symp Res Release, min: 0, max: 4194304, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Key Down Level, min: 0, max: 4194304, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Key Up Level, min: 0, max: 4194304, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Pedal Level, min: 0, max: 4194304, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Comp OnOff, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Comp Fast, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Tremolo OnOff, min: 0, max: 1, input_type: Toggle }
  FX:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Chorus DryWet, min: 0, max: 4194304, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Chorus Intensity, min: 0, max: 4194304, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Phaser Rate, min: 0, max: 4194304, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Phaser Depth, min: 0, max: 4194304, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Tremolo Speed Free, min: 0, max: 4194304, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Tremolo Speed Synced, min: 0, max: 17, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Tremolo Depth, min: 0, max: 4194304, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Tremolo Stereo Width, min: 0, max: 4194304, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Chorus OnOff, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Chorus Stereo, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Phaser OnOff, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Phaser Color, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Phaser Stereo, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: Tremolo Sync, min: 0, max: 1, input_type: Toggle }
      B7: { name: button7, key: ButtonCcs, target: Tremolo Type, min: 0, max: 1, input_type: Toggle }
  Overdrive/EQ:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Overdrive Drive, min: 0, max: 4194304, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Overdrive Presence, min: 0, max: 4194304, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Overdrive Type, min: 0, max: 2, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Ambience Level, min: 0, max: 4194304, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Ambience Type, min: 0, max: 4, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: EQ Lo Gain, min: 0, max: 4194304, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: EQ Mid Gain, min: 0, max: 4194304, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: EQ Hi Gain, min: 0, max: 4194304, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Overdrive OnOff, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: EQ OnOff, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: EQ Pre Overdrive, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Ambience OnOff, min: 0, max: 1, input_type: Toggle }
