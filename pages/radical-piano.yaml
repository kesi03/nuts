scope:
  manufacturer: Propellerhead Software
  model: se.propellerheads.radicalpiano

pages:

  Piano:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }

    navigation:
      - { name: "Piano", page: "Piano", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Envelope", page: "Envelope", key: UserCc, min: 0, max: 1, input_type: Toggle }
