      - { name: "Ambience", page: "Ambience", key: LearnCc, min: 0, max: 1, input_type: Toggle }

    controls:
      SD:  { name: speedDial, key: SpeedDialCc, target: Character, min: 0, max: 24, input_type: Value }
      SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: EQ On/Off, min: 0, max: 1, input_type: Toggle }
      F:   { name: fader, key: XfaderCcs, target: Master Volume, min: 0, max: 4194304, input_type: Value }

    encoders:
