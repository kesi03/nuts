scope:
  manufacturer: Propellerheads
  model: RV7000 Advanced Reverb
pages:
  Main:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }
    navigation:
      - { name: "Main", page: "Main", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "SoftKnobsA", page: "SoftKnobsA", key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Reverb", page: "Reverb", key: InstrCc, min: 0, max: 1, input_type: Toggle }
    controls:
      SD: {name: speedDial, key: SpeedDialCc, target: Dry/Wet, min: 0, max: 127, input_type: Value}
      SDB: {name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle}
      F: {name: fader, key: XfaderCcs, target: Decay, min: 0, max: 127, input_type: Value}
    encoders:
      E1: {name: encoder1, key: EncoderCcs, target: Dry/Wet, min: 0, max: 127, input_type: Value}
      E2: {name: encoder2, key: EncoderCcs, target: Decay, min: 0, max: 127, input_type: Value}
      E3: {name: encoder3, key: EncoderCcs, target: HF Damp, min: 0, max: 127, input_type: Value}
      E4: {name: encoder4, key: EncoderCcs, target: Hi EQ, min: -64, max: 63, input_type: Value}
      E5: {name: encoder5, key: EncoderCcs, target: Edit Mode, min: 0, max: 2, input_type: Value}
      E6: {name: encoder6, key: EncoderCcs, target: Soft Knob 1, min: 0, max: 16383, input_type: Value}
      E7: {name: encoder7, key: EncoderCcs, target: Soft Knob 2, min: 0, max: 16383, input_type: Value}
      E8: {name: encoder8, key: EncoderCcs, target: Soft Knob 3, min: 0, max: 16383, input_type: Value}
    buttons:
      B1: {name: button1, key: ButtonCcs, target: Gate On/Off, min: 0, max: 1, input_type: Toggle}
      B2: {name: button2, key: ButtonCcs, target: EQ On/Off, min: 0, max: 1, input_type: Toggle}
      B3: {name: button3, key: ButtonCcs, target: Enabled, min: 0, max: 2, input_type: Value}
