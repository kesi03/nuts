scope:
  manufacturer: Propellerheads
  model: Kong Drum Designer
pages:
  Mixer:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }
    navigation:
      - { name: "Mixer", page: "Mixer", key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Drum", page: "Drum", key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: "DrumEngine", page: "DrumEngine", key: InstrCc, min: 0, max: 1, input_type: Toggle }
      - { name: "FX", page: "FX", key: LearnCc, min: 0, max: 1, input_type: Toggle }
    controls:
      SD: {name: speedDial, key: SpeedDialCc, target: Master Level, min: 0, max: 127, input_type: Value}
      SDB: {name: speedDialButton, key: SpeedDialButtonCc, target: Master FX On, min: 0, max: 1, input_type: Toggle}
      F: {name: fader, key: XfaderCcs, target: Pan, min: 0, max: 127, input_type: Value}
    encoders:
      E1: {name: encoder1, key: EncoderCcs, target: Drum 1 Level, min: 0, max: 127, input_type: Value}
      E2: {name: encoder2, key: EncoderCcs, target: Drum 2 Level, min: 0, max: 127, input_type: Value}
      E3: {name: encoder3, key: EncoderCcs, target: Drum 3 Level, min: 0, max: 127, input_type: Value}
      E4: {name: encoder4, key: EncoderCcs, target: Drum 4 Level, min: 0, max: 127, input_type: Value}
      E5: {name: encoder5, key: EncoderCcs, target: Drum 5 Level, min: 0, max: 127, input_type: Value}
      E6: {name: encoder6, key: EncoderCcs, target: Drum 6 Level, min: 0, max: 127, input_type: Value}
      E7: {name: encoder7, key: EncoderCcs, target: Drum 7 Level, min: 0, max: 127, input_type: Value}
      E8: {name: encoder8, key: EncoderCcs, target: Drum 8 Level, min: 0, max: 127, input_type: Value}
    buttons:
      B1: {name: button1, key: ButtonCcs, target: Pad 1 Mute, min: 0, max: 1, input_type: Toggle}
      B2: {name: button2, key: ButtonCcs, target: Pad 2 Mute, min: 0, max: 1, input_type: Toggle}
      B3: {name: button3, key: ButtonCcs, target: Pad 3 Mute, min: 0, max: 1, input_type: Toggle}
      B4: {name: button4, key: ButtonCcs, target: Pad 4 Mute, min: 0, max: 1, input_type: Toggle}
      B5: {name: button5, key: ButtonCcs, target: Pad 5 Mute, min: 0, max: 1, input_type: Toggle}
      B6: {name: button6, key: ButtonCcs, target: Pad 6 Mute, min: 0, max: 1, input_type: Toggle}
      B7: {name: button7, key: ButtonCcs, target: Pad 7 Mute, min: 0, max: 1, input_type: Toggle}
      B8: {name: button8, key: ButtonCcs, target: Pad 8 Mute, min: 0, max: 1, input_type: Toggle}
