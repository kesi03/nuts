scope:
  manufacturer: Propellerhead Software
  model: se.propellerheads.Klang
pages:
  Main:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }
    navigation:
      - { name: "Main", page: "Main", key: MixCc, min: 0, max: 1, input_type: Toggle }
    controls:
      SD: {name: speedDial, key: SpeedDialCc, target: Master_Volume, min: 0, max: 4194304, input_type: Value}
      SDB: {name: speedDialButton, key: SpeedDialButtonCc, target: Filter_On, min: 0, max: 1, input_type: Toggle}
      F: {name: fader, key: XfaderCcs, target: Master_Volume, min: 0, max: 4194304, input_type: Value}
    encoders:
      E1: {name: encoder1, key: EncoderCcs, target: Instrument, min: 0, max: 9, input_type: Value}
      E2: {name: encoder2, key: EncoderCcs, target: SampleStart, min: 0, max: 4194304, input_type: Value}
      E3: {name: encoder3, key: EncoderCcs, target: Octave, min: 0, max: 4, input_type: Value}
      E4: {name: encoder4, key: EncoderCcs, target: Semitune, min: 0, max: 24, input_type: Value}
      E5: {name: encoder5, key: EncoderCcs, target: Filter_Cutoff, min: 0, max: 4194304, input_type: Value}
      E6: {name: encoder6, key: EncoderCcs, target: Filter_Reso, min: 0, max: 4194304, input_type: Value}
      E7: {name: encoder7, key: EncoderCcs, target: Delay Amount, min: 0, max: 4194304, input_type: Value}
      E8: {name: encoder8, key: EncoderCcs, target: Reverb Amount, min: 0, max: 4194304, input_type: Value}
    buttons:
      B1: {name: button1, key: ButtonCcs, target: Filter_On, min: 0, max: 1, input_type: Toggle}
      B2: {name: button2, key: ButtonCcs, target: Delay_On, min: 0, max: 1, input_type: Toggle}
      B3: {name: button3, key: ButtonCcs, target: Reverb_On, min: 0, max: 1, input_type: Toggle}
  