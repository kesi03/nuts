scope:
  manufacturer: Propellerheads
  model: Thor Polysonic Synthesizer

pages:

  OSC:

    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }

    navigation:
      - { name: OSC, page: OSC, key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: FILTER, page: FILTER, key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: MOD, page: MOD, key: InstrCc, min: 0, max: 1, input_type: Toggle }
      - { name: FXPERF, page: FXPERF, key: LearnCc, min: 0, max: 1, input_type: Toggle }

    controls:
      SD: { name: speedDial, key: SpeedDialCc, target: Master Level, min: 0, max: 127, input_type: Value }
      SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Note Trigger MIDI, min: 0, max: 1, input_type: Toggle }
      F: { name: fader, key: XfaderCcs, target: Amplifier Pan, min: -64, max: 63, input_type: Value }

    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Osc 1 Type, min: 0, max: 6, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Osc 1 Oct, min: 0, max: 9, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Osc 1 Semi, min: 0, max: 12, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Osc 1 Tune, min: -50, max: 50, input_type: Value }

    buttons:
      B1: { name: button1, key: ButtonCcs, target: Osc 2 Sync To Osc 1, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Osc 3 Sync To Osc 1, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Osc 1 To Filter 1 Enable, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Osc 2 To Filter 1 Enable, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Osc 3 To Filter 1 Enable, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: Osc 1 To Filter 2 Enable, min: 0, max: 1, input_type: Toggle }
      B7: { name: button7, key: ButtonCcs, target: Osc 2 To Filter 2 Enable, min: 0, max: 1, input_type: Toggle }
      B8: { name: button8, key: ButtonCcs, target: Osc 3 To Filter 2 Enable, min: 0, max: 1, input_type: Toggle }

  FILTER:

    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }

    navigation:
      - { name: OSC, page: OSC, key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: FILTER, page: FILTER, key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: MOD, page: MOD, key: InstrCc, min: 0, max: 1, input_type: Toggle }
      - { name: FXPERF, page: FXPERF, key: LearnCc, min: 0, max: 1, input_type: Toggle }

    controls:
      SD: { name: speedDial, key: SpeedDialCc, target: Master Level, min: 0, max: 127, input_type: Value }
      SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Note Trigger MIDI, min: 0, max: 1, input_type: Toggle }
      F: { name: fader, key: XfaderCcs, target: Amplifier Pan, min: -64, max: 63, input_type: Value }

    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Filter 1 Freq, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Filter 1 Res, min: 0, max: 127, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Filter 2 Freq, min: 0, max: 127, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Filter 2 Res, min: 0, max: 127, input_type: Value }

    buttons:
      B1: { name: button1, key: ButtonCcs, target: Filter 1 Env Invert, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Filter 2 Env Invert, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Filter 1 Self Osc, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Filter 2 Self Osc, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Shaper On, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: Filter2ToAmplifier Enable, min: 0, max: 1, input_type: Toggle }
      B7: { name: button7, key: ButtonCcs, target: Filter 1 Type, min: 0, max: 4, input_type: Value }
      B8: { name: button8, key: ButtonCcs, target: Filter 2 Type, min: 0, max: 4, input_type: Value }

  MOD:

    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }

    navigation:
      - { name: OSC, page: OSC, key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: FILTER, page: FILTER, key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: MOD, page: MOD, key: InstrCc, min: 0, max: 1, input_type: Toggle }
      - { name: FXPERF, page: FXPERF, key: LearnCc, min: 0, max: 1, input_type: Toggle }

    controls:
      SD: { name: speedDial, key: SpeedDialCc, target: Master Level, min: 0, max: 127, input_type: Value }
      SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Note Trigger MIDI, min: 0, max: 1, input_type: Toggle }
      F: { name: fader, key: XfaderCcs, target: Amplifier Pan, min: -64, max: 63, input_type: Value }

    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: LFO 1 Rate, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: LFO 1 Delay, min: 0, max: 127, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Amp Env Attack, min: 0, max: 127, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Amp Env Release, min: 0, max: 127, input_type: Value }

    buttons:
      B1: { name: button1, key: ButtonCcs, target: LFO 1 Key Sync, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: LFO 1 Tempo Sync, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: LFO 2 Key Sync, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: LFO 2 Tempo Sync, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Amp Env Gate Trig On, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: Filter Env Gate Trig On, min: 0, max: 1, input_type: Toggle }
      B7: { name: button7, key: ButtonCcs, target: Mod Env Gate Trig On, min: 0, max: 1, input_type: Toggle }
      B8: { name: button8, key: ButtonCcs, target: Mod Env Loop, min: 0, max: 1, input_type: Toggle }

  FXPERF:

    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus, key: PagePlusCc, direction: "+", min: 0, max: 1, input_type: Toggle }

    navigation:
      - { name: OSC, page: OSC, key: MixCc, min: 0, max: 1, input_type: Toggle }
      - { name: FILTER, page: FILTER, key: UserCc, min: 0, max: 1, input_type: Toggle }
      - { name: MOD, page: MOD, key: InstrCc, min: 0, max: 1, input_type: Toggle }
      - { name: FXPERF, page: FXPERF, key: LearnCc, min: 0, max: 1, input_type: Toggle }

    controls:
      SD: { name: speedDial, key: SpeedDialCc, target: Master Level, min: 0, max: 127, input_type: Value }
      SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Note Trigger MIDI, min: 0, max: 1, input_type: Toggle }
      F: { name: fader, key: XfaderCcs, target: Amplifier Pan, min: -64, max: 63, input_type: Value }

    encoders:
      E1: { target: Chorus Rate, min: 0, max: 127, input_type: Value }
      E3: { target: Chorus Dry Wet, min: 0, max: 127, input_type: Value }
      E5: { target: Delay Time, min: 0, max: 127, input_type: Value }
      E7: { target: Delay Dry Wet, min: 0, max: 127, input_type: Value }

    buttons:
      B1: { target: Chorus On, min: 0, max: 1, input_type: Toggle }
      B2: { target: Delay On, min: 0, max: 1, input_type: Toggle }
      B3: { target: Button 1, min: 0, max: 1, input_type: Toggle }
      B4: { target: Button 2, min: 0, max: 1, input_type: Toggle }
      B5: { target: Rotary 1, min: 0, max: 127, input_type: Value }
      B6: { target: Rotary 2, min: 0, max: 127, input_type: Value }
      B7: { target: Button 1 MIDI Key On, min: 0, max: 1, input_type: Toggle }
      B8: { target: Button 2 MIDI Key On, min: 0, max: 1, input_type: Toggle }