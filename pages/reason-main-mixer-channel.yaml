scope:
  manufacturer: Propellerheads
  model: Reason Main Mixer Channel
  display: Reason Main Mixer Channel

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: Level, min: 0, max: 1000, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Solo, min: 0, max: 1, input_type: Toggle }
  F: { name: fader, key: XfaderCcs, target: Pan, min: -100, max: 100, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Mixer:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Width, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Input Gain, min: -64, max: 63, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: LPF Frequency, min: 0, max: 1000, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: HPF Frequency, min: 0, max: 1000, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Mute, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Invert Phase, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Insert Pre, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Dyn Post EQ, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: LPF On, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: HPF On, min: 0, max: 1, input_type: Toggle }
      B7: { name: button7, key: ButtonCcs, target: Filters Dyn S/C, min: 0, max: 1, input_type: Toggle }
  Dynamics:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: C Threshold, min: 0, max: 127, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: C Ratio, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: C Release, min: 0, max: 127, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: C Fast Atk, min: 0, max: 127, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: G Threshold, min: 0, max: 127, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: G Range, min: 0, max: 127, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: G Release, min: 0, max: 127, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: G Hold, min: 0, max: 127, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Comp On, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: C Peak, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Gate On, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Expander, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: G Fast Atk, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: Key On, min: 0, max: 1, input_type: Toggle }
  EQ:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: HF Gain, min: -64, max: 63, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: HF Frequency, min: 0, max: 1000, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: HMF Gain, min: -64, max: 63, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: HMF Frequency, min: 0, max: 1000, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: EQ On, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: EQ E Mode, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: HF Bell, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: HF On, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: HMF On, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: LMF On, min: 0, max: 1, input_type: Toggle }
      B7: { name: button7, key: ButtonCcs, target: LF Bell, min: 0, max: 1, input_type: Toggle }
      B8: { name: button8, key: ButtonCcs, target: LF On, min: 0, max: 1, input_type: Toggle }
  FX:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Rotary 1, min: 0, max: 127, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Rotary 2, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Rotary 3, min: 0, max: 127, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Rotary 4, min: 0, max: 127, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: FX1 Send Level, min: 0, max: 127, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: FX2 Send Level, min: 0, max: 127, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: FX3 Send Level, min: 0, max: 127, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: FX4 Send Level, min: 0, max: 127, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Button 1, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Button 2, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Button 3, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Button 4, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: FX1 Pre Fader, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: FX2 Pre Fader, min: 0, max: 1, input_type: Toggle }
      B7: { name: button7, key: ButtonCcs, target: FX3 Pre Fader, min: 0, max: 1, input_type: Toggle }
      B8: { name: button8, key: ButtonCcs, target: FX4 Pre Fader, min: 0, max: 1, input_type: Toggle }
