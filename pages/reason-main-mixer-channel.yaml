scope:
  manufacturer: Propellerheads
  model: Reason Main Mixer Channel

pages:
  Mixer:
    pager:
      - {
          name: pageMinus,
          key: PageMinusCc,
          direction: "-",
          min: 0,
          max: 1,
          input_type: Toggle,
        }
      - {
          name: pagePlus,
          key: PagePlusCc,
          direction: "+",
          min: 0,
          max: 1,
          input_type: Toggle,
        }

    navigation:
      - {
          name: Mixer,
          page: Mixer,
          key: MixCc,
          min: 0,
          max: 1,
          input_type: Toggle,
        }
      - { name: EQ, page: EQ, key: UserCc, min: 0, max: 1, input_type: Toggle }
      - {
          name: Dynamics,
          page: Dynamics,
          key: InstrCc,
          min: 0,
          max: 1,
