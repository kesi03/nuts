        }
      - {
          name: Insert FX,
          page: InsertFX,
          key: FXCc,
          min: 0,
          max: 1,
          input_type: Toggle,
        }

    controls:
      SD:
        {
          name: speedDial,
          key: SpeedDialCc,
          target: Level,
          min: 0,
          max: 1000,
          input_type: Value,
        }
      SDB:
        {
          name: speedDialButton,
          key: SpeedDialButtonCc,
          target: Solo,
          min: 0,
          max: 1,
          input_type: Toggle,
