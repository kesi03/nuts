scope:
  manufacturer: Propellerheads
  model: NN-XT Advanced Sampler
  display: NN-XT

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: Master Volume, min: 0, max: 127, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: High Quality Interpolation, min: 0, max: 1, input_type: Toggle }
  F: { name: fader, key: XfaderCcs, target: Filter Freq, min: 0, max: 127, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Main:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Mod Env Decay, min: -64, max: 63, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: External Controller, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: External Controller Source, min: 0, max: 2, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Filter Res, min: -64, max: 63, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Amp Env Attack, min: -64, max: 63, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Amp Env Decay, min: -64, max: 63, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Amp Env Release, min: -64, max: 63, input_type: Value }
