scope:
  manufacturer: Propellerheads
  model: Malstrom Graintable Synthesizer
  display: Malstrom

# The shared, NOT banked controls: one item each, mapped once
# per scope. They must be the same on every page.
controls:
  SD: { name: speedDial, key: SpeedDialCc, target: Master Level, min: 0, max: 127, input_type: Value }
  SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Legato On/Off, min: 0, max: 1, input_type: Toggle }
  F: { name: fader, key: XfaderCcs, target: Polyphony, min: 1, max: 16, input_type: Value }

# The pages, in the order of the driver's page slots. A scope's
# page 1 is the driver's slot 1, and so on.
pages:
  Oscillators:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Oscillator A Index, min: 0, max: 127, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Oscillator A Motion, min: -64, max: 63, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Oscillator A Shift, min: -64, max: 63, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Oscillator A Gain, min: 0, max: 127, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Oscillator B Index, min: 0, max: 127, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Oscillator B Motion, min: -64, max: 63, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Oscillator B Shift, min: -64, max: 63, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Oscillator B Gain, min: 0, max: 127, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Oscillator A On/Off, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Oscillator B On/Off, min: 0, max: 1, input_type: Toggle }
  Filter:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Filter A Freq, min: 0, max: 127, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Filter A Resonance, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Filter B Freq, min: 0, max: 127, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Filter B Resonance, min: 0, max: 127, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Filter Env Amount, min: 0, max: 127, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Shaper Amount, min: 0, max: 127, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Shaper Mode, min: 0, max: 4, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Velocity To Filter Env, min: -64, max: 63, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Filter A On/Off, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Filter B On/Off, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Filter Env Invert, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Shaper On/Off, min: 0, max: 1, input_type: Toggle }
  Modulation:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Modulator A Curve, min: 0, max: 31, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Modulator A Rate, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Modulator A To Pitch, min: -64, max: 63, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Modulator A To Index, min: -64, max: 63, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Modulator B Curve, min: 0, max: 31, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Modulator B Rate, min: 0, max: 127, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Modulator B To Filter, min: -64, max: 63, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Modulator B To Motion, min: -64, max: 63, input_type: Value }
    buttons:
      B1: { name: button1, key: ButtonCcs, target: Modulator A On/Off, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Modulator B On/Off, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Modulator A Sync, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Modulator B Sync, min: 0, max: 1, input_type: Toggle }
  Performance:
    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Portamento, min: 0, max: 127, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Velocity To Level A, min: -64, max: 63, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Velocity To Level B, min: -64, max: 63, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Velocity To Attack, min: -64, max: 63, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Velocity To Shift, min: -64, max: 63, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Velocity To Modulator, min: -64, max: 63, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Spread Amount, min: 0, max: 127, input_type: Value }
    buttons:
      B2: { name: button2, key: ButtonCcs, target: Route Oscillator B To Filter B, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Route Oscillator A To Filter B, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Route Filter B To Shaper, min: 0, max: 1, input_type: Toggle }
