scope:
  manufacturer: Propellerheads
  model: MClass Equalizer

pages:

  Main:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus,  key: PagePlusCc,  direction: "+", min: 0, max: 1, input_type: Toggle }

    navigation:
      - { name: "Main",        page: "Main",        key: MixCc,   min: 0, max: 1, input_type: Toggle }
      - { name: "LowBand",     page: "LowBand",     key: UserCc,  min: 0, max: 1, input_type: Toggle }
      - { name: "Parametric1", page: "Parametric1", key: InstrCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Parametric2", page: "Parametric2", key: LearnCc, min: 0, max: 1, input_type: Toggle }

    controls:
      SD:  { name: speedDial,       key: SpeedDialCc,       target: Low Shelf Gain, min: -64, max: 63, input_type: Value }
      SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle }
      F:   { name: fader,           key: XfaderCcs,         target: Hi Shelf Gain, min: -64, max: 63, input_type: Value }

    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Low Shelf Frequency,  min: 0, max: 1000, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Low Shelf Gain,       min: -64, max: 63, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Parametric 1 Frequency, min: 0, max: 1000, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Parametric 1 Gain,    min: -64, max: 63, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Parametric 2 Frequency, min: 0, max: 1000, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Parametric 2 Gain,    min: -64, max: 63, input_type: Value }
      E7: { name: encoder7, key: EncoderCcs, target: Hi Shelf Frequency,   min: 0, max: 1000, input_type: Value }
      E8: { name: encoder8, key: EncoderCcs, target: Hi Shelf Gain,        min: -64, max: 63, input_type: Value }

    buttons:
      B1: { name: button1, key: ButtonCcs, target: Low Cut Enable, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Low Shelf Enable, min: 0, max: 1, input_type: Toggle }
      B3: { name: button3, key: ButtonCcs, target: Parametric 1 Enable, min: 0, max: 1, input_type: Toggle }
      B4: { name: button4, key: ButtonCcs, target: Parametric 2 Enable, min: 0, max: 1, input_type: Toggle }
      B5: { name: button5, key: ButtonCcs, target: Hi Shelf Enable, min: 0, max: 1, input_type: Toggle }
      B6: { name: button6, key: ButtonCcs, target: Enabled, min: 0, max: 1, input_type: Toggle }

  LowBand:
    pager:
      - { name: pageMinus, key: PageMinusCc, direction: "-", min: 0, max: 1, input_type: Toggle }
      - { name: pagePlus,  key: PagePlusCc,  direction: "+", min: 0, max: 1, input_type: Toggle }

    navigation:
      - { name: "Main",        page: "Main",        key: MixCc,   min: 0, max: 1, input_type: Toggle }
      - { name: "LowBand",     page: "LowBand",     key: UserCc,  min: 0, max: 1, input_type: Toggle }
      - { name: "Parametric1", page: "Parametric1", key: InstrCc, min: 0, max: 1, input_type: Toggle }
      - { name: "Parametric2", page: "Parametric2", key: LearnCc, min: 0, max: 1, input_type: Toggle }

    controls:
      SD:  { name: speedDial,       key: SpeedDialCc,       target: Low Shelf Gain, min: -64, max: 63, input_type: Value }
      SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle }
      F:   { name: fader,           key: XfaderCcs,         target: Hi Shelf Gain, min: -64, max: 63, input_type: Value }

    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Low Shelf Frequency, min: 0, max: 1000, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Low Shelf Gain,      min: -64, max: 63, input_type: Value }
      E3: { name: encoder3, key: EncoderCcs, target: Low Shelf Q,         min: 0, max: 127, input_type: Value }
      E4: { name: encoder4, key: EncoderCcs, target: Hi Shelf Frequency,  min: 0, max: 1000, input_type: Value }
      E5: { name: encoder5, key: EncoderCcs, target: Hi Shelf Gain,       min: -64, max: 63, input_type: Value }
      E6: { name: encoder6, key: EncoderCcs, target: Hi Shelf Q,          min: 0, max: 127, input_type: Value }

    buttons:
      B1: { name: button1, key: ButtonCcs, target: Low Cut Enable, min: 0, max: 1, input_type: Toggle }
      B2: { name: button2, key: ButtonCcs, target: Low Shelf Enable, min: 0, max: 1, input_type: Toggle }
