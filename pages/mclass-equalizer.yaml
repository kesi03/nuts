      SDB: { name: speedDialButton, key: SpeedDialButtonCc, target: Enabled, min: 0, max: 1, input_type: Toggle }
      F:   { name: fader,           key: XfaderCcs,         target: Hi Shelf Gain, min: -64, max: 63, input_type: Value }

    encoders:
      E1: { name: encoder1, key: EncoderCcs, target: Parametric 1 Frequency, min: 0, max: 1000, input_type: Value }
      E2: { name: encoder2, key: EncoderCcs, target: Parametric 1 Gain,      min: -64, max: 63, input_type: Value }
