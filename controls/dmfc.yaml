        { name: "speedDial", remotable: "Master_Filter", key: SpeedDialCC, min: 0, max: 4194304, input_type: value }
      SDB:
        { name: "speedDialButton", remotable: "Master_Delay", key: SpeedDialButtonCC, min: 0, max: 4194304, input_type: value }
