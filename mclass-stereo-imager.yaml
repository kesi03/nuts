manufacturer: "Propellerheads"
model: "MClass Stereo Imager"

Pages:
  Main:
    middle:
      SD:
        { name: "speedDial", remotable: "X-Over Frequency", key: SpeedDialCC, min: 0, max: 127, input_type: value }
      SDB:
        { name: "speedDialButton", remotable: "Separate Out Mode", key: SpeedDialButtonCC, min: 0, max: 1, input_type: toggle }
      FD:
        { name: "fader", remotable: "Low Width", key: XFaderCC, min: -64, max: 63, input_type: value }

    buttons:
      B1: { name: "button1", remotable: "Separate Out Mode", key: ButtonCCs, min: 0, max: 1, input_type: toggle }
      B2: { name: "button2", remotable: "Enabled", key: ButtonCCs, min: 0, max: 2, input_type: value }

    encoders:
      E1: { name: "encoder1", remotable: "Low Width", key: EncoderCCs, min: -64, max: 63, input_type: value }
      E2: { name: "encoder2", remotable: "High Width", key: EncoderCCs, min: -64, max: 63, input_type: value }
      E3: { name: "encoder3", remotable: "X-Over Frequency", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E4: { name: "encoder4", remotable: "Solo Mode", key: EncoderCCs, min: 0, max: 2, input_type: value }
      E5: { name: "encoder5", remotable: "Enabled", key: EncoderCCs, min: 0, max: 2, input_type: value }
      E6: { name: "encoder6", remotable: "Separate Out Mode", key: EncoderCCs, min: 0, max: 1, input_type: toggle }

  Width:
    middle:
      SD:
        { name: "speedDial", remotable: "Low Width", key: SpeedDialCC, min: -64, max: 63, input_type: value }
      FD:
        { name: "fader", remotable: "High Width", key: XFaderCC, min: -64, max: 63, input_type: value }

    encoders:
      E1: { name: "encoder1", remotable: "Low Width", key: EncoderCCs, min: -64, max: 63, input_type: value }
      E2: { name: "encoder2", remotable: "High Width", key: EncoderCCs, min: -64, max: 63, input_type: value }
      E3: { name: "encoder3", remotable: "X-Over Frequency", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E4: { name: "encoder4", remotable: "Solo Mode", key: EncoderCCs, min: 0, max: 2, input_type: value }

  Routing:
    middle:
      SD:
        { name: "speedDial", remotable: "Solo Mode", key: SpeedDialCC, min: 0, max: 2, input_type: value }
      SDB:
        { name: "speedDialButton", remotable: "Separate Out Mode", key: SpeedDialButtonCC, min: 0, max: 1, input_type: toggle }
      FD:
        { name: "fader", remotable: "X-Over Frequency", key: XFaderCC, min: 0, max: 127, input_type: value }

    buttons:
      B1: { name: "button1", remotable: "Separate Out Mode", key: ButtonCCs, min: 0, max: 1, input_type: toggle }
      B2: { name: "button2", remotable: "Enabled", key: ButtonCCs, min: 0, max: 2, input_type: value }

    encoders:
      E1: { name: "encoder1", remotable: "Solo Mode", key: EncoderCCs, min: 0, max: 2, input_type: value }
      E2: { name: "encoder2", remotable: "X-Over Frequency", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E3: { name: "encoder3", remotable: "Low Width", key: EncoderCCs, min: -64, max: 63, input_type: value }
      E4: { name: "encoder4", remotable: "High Width", key: EncoderCCs, min: -64, max: 63, input_type: value }