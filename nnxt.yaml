manufacturer: "Propellerheads"
model: "NN-XT Advanced Sampler"

Pages:

  Main:
    middle:
      SD:
        { name: "speedDial", remotable: "Master Volume", key: SpeedDialCC, min: 0, max: 127, input_type: value }

      FD:
        { name: "fader", remotable: "Master Volume", key: XFaderCC, min: 0, max: 127, input_type: value }

    buttons:
      B1:
        { name: "button1", remotable: "High Quality Interpolation", key: ButtonCCs, min: 0, max: 1, input_type: toggle }

    encoders:
      E1:
        { name: "encoder1", remotable: "Master Volume", key: EncoderCCs, min: 0, max: 127, input_type: value }

      E2:
        { name: "encoder2", remotable: "External Controller", key: EncoderCCs, min: 0, max: 127, input_type: value }

      E3:
        { name: "encoder3", remotable: "External Controller Source", key: EncoderCCs, min: 0, max: 2, input_type: value }

  Filter:
    middle:
      SD:
        { name: "speedDial", remotable: "Filter Freq", key: SpeedDialCC, min: -64, max: 63, input_type: value }

    encoders:
      E1:
        { name: "encoder1", remotable: "Filter Freq", key: EncoderCCs, min: -64, max: 63, input_type: value }

      E2:
        { name: "encoder2", remotable: "Filter Res", key: EncoderCCs, min: -64, max: 63, input_type: value }

  AmpEnv:
    middle:
      SD:
        { name: "speedDial", remotable: "Amp Env Attack", key: SpeedDialCC, min: -64, max: 63, input_type: value }

    encoders:
      E1:
        { name: "encoder1", remotable: "Amp Env Attack", key: EncoderCCs, min: -64, max: 63, input_type: value }

      E2:
        { name: "encoder2", remotable: "Amp Env Decay", key: EncoderCCs, min: -64, max: 63, input_type: value }

      E3:
        { name: "encoder3", remotable: "Amp Env Release", key: EncoderCCs, min: -64, max: 63, input_type: value }

  ModEnv:
    middle:
      SD:
        { name: "speedDial", remotable: "Mod Env Decay", key: SpeedDialCC, min: -64, max: 63, input_type: value }

    encoders:
      E1:
        { name: "encoder1", remotable: "Mod Env Decay", key: EncoderCCs, min: -64, max: 63, input_type: value }