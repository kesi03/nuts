manufacturer: "Propellerheads"
model: "Redrum Drum Computer"

Pages:

  Mixer:
    middle:
      SD:
        { name: "speedDial", remotable: "Master Level", key: SpeedDialCC, min: 0, max: 127, input_type: value }
      FD:
        { name: "fader", remotable: "Master Level", key: XFaderCC, min: 0, max: 127, input_type: value }

    buttons:
      B1: { name: "button1", remotable: "Drum 1 Mute", key: ButtonCCs, min: 0, max: 1, input_type: toggle }
      B2: { name: "button2", remotable: "Drum 2 Mute", key: ButtonCCs, min: 0, max: 1, input_type: toggle }
      B3: { name: "button3", remotable: "Drum 3 Mute", key: ButtonCCs, min: 0, max: 1, input_type: toggle }
      B4: { name: "button4", remotable: "Drum 4 Mute", key: ButtonCCs, min: 0, max: 1, input_type: toggle }
      B5: { name: "button5", remotable: "Drum 5 Mute", key: ButtonCCs, min: 0, max: 1, input_type: toggle }
      B6: { name: "button6", remotable: "Drum 6 Mute", key: ButtonCCs, min: 0, max: 1, input_type: toggle }
      B7: { name: "button7", remotable: "Drum 7 Mute", key: ButtonCCs, min: 0, max: 1, input_type: toggle }
      B8: { name: "button8", remotable: "Drum 8 Mute", key: ButtonCCs, min: 0, max: 1, input_type: toggle }

    encoders:
      E1: { name: "encoder1", remotable: "Drum 1 Level", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E2: { name: "encoder2", remotable: "Drum 2 Level", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E3: { name: "encoder3", remotable: "Drum 3 Level", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E4: { name: "encoder4", remotable: "Drum 4 Level", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E5: { name: "encoder5", remotable: "Drum 5 Level", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E6: { name: "encoder6", remotable: "Drum 6 Level", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E7: { name: "encoder7", remotable: "Drum 7 Level", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E8: { name: "encoder8", remotable: "Drum 8 Level", key: EncoderCCs, min: 0, max: 127, input_type: value }

  Drum:
    middle:
      SD:
        { name: "speedDial", remotable: "Selected Drum", key: SpeedDialCC, min: 1, max: 10, input_type: value }
      FD:
        { name: "fader", remotable: "Level", key: XFaderCC, dynamic: true }

    buttons:
      B1: { name: "button1", remotable: "Mute", key: ButtonCCs, dynamic: true, input_type: toggle }
      B2: { name: "button2", remotable: "Solo", key: ButtonCCs, dynamic: true, input_type: toggle }
      B3: { name: "button3", remotable: "Decay/Gate Mode", key: ButtonCCs, dynamic: true, input_type: toggle }

    encoders:
      E1: { name: "encoder1", remotable: "Selected Drum", key: EncoderCCs, min: 1, max: 10, input_type: value }
      E2: { name: "encoder2", remotable: "Level", key: EncoderCCs, dynamic: true, input_type: value }
      E3: { name: "encoder3", remotable: "Pan", key: EncoderCCs, dynamic: true, input_type: value }
      E4: { name: "encoder4", remotable: "Pitch", key: EncoderCCs, dynamic: true, input_type: value }
      E5: { name: "encoder5", remotable: "Length", key: EncoderCCs, dynamic: true, input_type: value }
      E6: { name: "encoder6", remotable: "Send 1 Amount", key: EncoderCCs, dynamic: true, input_type: value }
      E7: { name: "encoder7", remotable: "Send 2 Amount", key: EncoderCCs, dynamic: true, input_type: value }
      E8: { name: "encoder8", remotable: "Vel to Level", key: EncoderCCs, dynamic: true, input_type: value }

  Sound:
    middle:
      SD:
        { name: "speedDial", remotable: "Selected Drum", key: SpeedDialCC, min: 1, max: 10, input_type: value }
      FD:
        { name: "fader", remotable: "Special Parameter", key: XFaderCC, dynamic: true }

    buttons:
      B1: { name: "button1", remotable: "Mute", key: ButtonCCs, dynamic: true, input_type: toggle }
      B2: { name: "button2", remotable: "Solo", key: ButtonCCs, dynamic: true, input_type: toggle }

    encoders:
      E1: { name: "encoder1", remotable: "Selected Drum", key: EncoderCCs, min: 1, max: 10, input_type: value }
      E2: { name: "encoder2", remotable: "Special Parameter", key: EncoderCCs, dynamic: true, input_type: value }
      E3: { name: "encoder3", remotable: "Special Velocity Parameter", key: EncoderCCs, dynamic: true, input_type: value }
      E4: { name: "encoder4", remotable: "Pan", key: EncoderCCs, dynamic: true, input_type: value }
      E5: { name: "encoder5", remotable: "Pitch", key: EncoderCCs, dynamic: true, input_type: value }
      E6: { name: "encoder6", remotable: "Length", key: EncoderCCs, dynamic: true, input_type: value }
      E7: { name: "encoder7", remotable: "Send 1 Amount", key: EncoderCCs, dynamic: true, input_type: value }
      E8: { name: "encoder8", remotable: "Send 2 Amount", key: EncoderCCs, dynamic: true, input_type: value }

    dynamic_mapping:
      Drum1:
        parameter1: "Drum 1 Tone"
        parameter2: "Drum 1 Vel to Tone"

      Drum2:
        parameter1: "Drum 2 Tone"
        parameter2: "Drum 2 Vel to Tone"

      Drum3:
        parameter1: "Drum 3 Sample Start"
        parameter2: "Drum 3 Vel to Sample Start"

      Drum4:
        parameter1: "Drum 4 Sample Start"
        parameter2: "Drum 4 Vel to Sample Start"

      Drum5:
        parameter1: "Drum 5 Sample Start"
        parameter2: "Drum 5 Vel to Sample Start"

      Drum6:
        parameter1: "Drum 6 Pitch Bend Amount"
        parameter2: "Drum 6 Vel to Pitch Bend"

      Drum7:
        parameter1: "Drum 7 Pitch Bend Amount"
        parameter2: "Drum 7 Vel to Pitch Bend"

      Drum8:
        parameter1: "Drum 8 Sample Start"
        parameter2: "Drum 8 Vel to Sample Start"

      Drum9:
        parameter1: "Drum 9 Sample Start"
        parameter2: "Drum 9 Vel to Sample Start"

      Drum10:
        parameter1: "Drum 10 Tone"
        parameter2: "Drum 10 Vel to Tone"

  Pattern:
    middle:
      SD:
        { name: "speedDial", remotable: "Selected Pattern", key: SpeedDialCC, min: -1, max: 31, input_type: value }
      FD:
        { name: "fader", remotable: "Steps", key: XFaderCC, min: 1, max: 64, input_type: value }

    buttons:
      B1: { name: "button1", remotable: "Run", key: ButtonCCs, min: 0, max: 1, input_type: toggle }
      B2: { name: "button2", remotable: "Pattern Enable", key: ButtonCCs, min: 0, max: 1, input_type: toggle }
      B3: { name: "button3", remotable: "Enable Pattern Section Playback", key: ButtonCCs, min: 0, max: 1, input_type: toggle }
      B4: { name: "button4", remotable: "Shuffle", key: ButtonCCs, min: 0, max: 1, input_type: toggle }
      B5: { name: "button5", remotable: "Edit Flam", key: ButtonCCs, min: 0, max: 1, input_type: toggle }

    encoders:
      E1: { name: "encoder1", remotable: "Selected Pattern", key: EncoderCCs, min: -1, max: 31, input_type: value }
      E2: { name: "encoder2", remotable: "Pattern Select in Bank", key: EncoderCCs, min: 0, max: 7, input_type: value }
      E3: { name: "encoder3", remotable: "Bank Select", key: EncoderCCs, min: 0, max: 3, input_type: value }
      E4: { name: "encoder4", remotable: "Resolution", key: EncoderCCs, min: 0, max: 8, input_type: value }
      E5: { name: "encoder5", remotable: "Steps", key: EncoderCCs, min: 1, max: 64, input_type: value }
      E6: { name: "encoder6", remotable: "Flam Amount", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E7: { name: "encoder7", remotable: "Edit Steps", key: EncoderCCs, min: 0, max: 3, input_type: value }
      E8: { name: "encoder8", remotable: "Remote Start Step", key: EncoderCCs, min: 1, max: 64, input_type: value }