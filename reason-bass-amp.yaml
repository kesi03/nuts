        { name: "speedDialButton", remotable: "Enabled", key: SpeedDialButtonCC, min: 0, max: 2, input_type: value }
      FD:
        { name: "fader", remotable: "Volume", key: XFaderCC, min: 0, max: 4194304, input_type: value }

    buttons:
