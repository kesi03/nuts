      B2: { name: "button2", remotable: "Ultra Hi", key: ButtonCCs, min: 0, max: 1, input_type: toggle }

    encoders:
      E1: { name: "encoder1", remotable: "Drive", key: EncoderCCs, min: 0, max: 4194304, input_type: value }
      E2: { name: "encoder2", remotable: "Bass", key: EncoderCCs, min: 0, max: 4194304, input_type: value }
      E3: { name: "encoder3", remotable: "Middle", key: EncoderCCs, min: 0, max: 4194304, input_type: value }
      E4: { name: "encoder4", remotable: "Treble", key: EncoderCCs, min: 0, max: 4194304, input_type: value }
      E5: { name: "encoder5", remotable: "Volume", key: EncoderCCs, min: 0, max: 4194304, input_type: value }
      E6: { name: "encoder6", remotable: "Amp Switch", key: EncoderCCs, min: 0, max: 2, input_type: value }
