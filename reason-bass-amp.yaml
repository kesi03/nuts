      SD:
        { name: "speedDial", remotable: "Mid Freq", key: SpeedDialCC, min: 0, max: 4, input_type: value }
      FD:
        { name: "fader", remotable: "Volume", key: XFaderCC, min: 0, max: 4194304, input_type: value }

    buttons:
      B1: { name: "button1", remotable: "Ultra Lo", key: ButtonCCs, min: 0, max: 1, input_type: toggle }
      B2: { name: "button2", remotable: "Ultra Hi", key: ButtonCCs, min: 0, max: 1, input_type: toggle }

