manufacturer: "Propellerheads"
model: "SubTractor Analog Synthesizer"

Pages:
  Oscillators:
    middle:
      SD:
        { name: "speedDial", remotable: "Osc Mix", key: SpeedDialCC, min: 0, max: 127, input_type: value }
      SDB:
        { name: "speedDialButton", remotable: "Osc2 On/Off", key: SpeedDialButtonCC, min: 0, max: 1, input_type: toggle }
      FD:
        { name: "fader", remotable: "Master Level", key: XFaderCC, min: 0, max: 127, input_type: value }

    buttons:
      B1: { name: "button1", remotable: "Osc2 On/Off", key: ButtonCCs, min: 0, max: 1, input_type: toggle }
      B2: { name: "button2", remotable: "Ring Mod", key: ButtonCCs, min: 0, max: 1, input_type: toggle }
      B3: { name: "button3", remotable: "Noise On/Off", key: ButtonCCs, min: 0, max: 1, input_type: toggle }

    encoders:
      E1: { name: "encoder1", remotable: "Osc1 Wave", key: EncoderCCs, min: 0, max: 31, input_type: value }
      E2: { name: "encoder2", remotable: "Osc1 Octave", key: EncoderCCs, min: 0, max: 9, input_type: value }
      E3: { name: "encoder3", remotable: "Osc1 Semitone", key: EncoderCCs, min: 0, max: 12, input_type: value }
      E4: { name: "encoder4", remotable: "Osc1 Fine Tune", key: EncoderCCs, min: -50, max: 50, input_type: value }
      E5: { name: "encoder5", remotable: "Osc2 Wave", key: EncoderCCs, min: 0, max: 31, input_type: value }
      E6: { name: "encoder6", remotable: "Osc2 Octave", key: EncoderCCs, min: 0, max: 9, input_type: value }
      E7: { name: "encoder7", remotable: "Osc2 Semitone", key: EncoderCCs, min: 0, max: 12, input_type: value }
      E8: { name: "encoder8", remotable: "Osc Mix", key: EncoderCCs, min: 0, max: 127, input_type: value }

  Filter:
    middle:
      SD:
        { name: "speedDial", remotable: "Filter Freq", key: SpeedDialCC, min: 0, max: 127, input_type: value }
      SDB:
        { name: "speedDialButton", remotable: "Filter2 On/Off", key: SpeedDialButtonCC, min: 0, max: 1, input_type: toggle }
      FD:
        { name: "fader", remotable: "Filter Env Amount", key: XFaderCC, min: 0, max: 127, input_type: value }

    buttons:
      B1: { name: "button1", remotable: "Filter2 On/Off", key: ButtonCCs, min: 0, max: 1, input_type: toggle }
      B2: { name: "button2", remotable: "Filter Link Freq On/Off", key: ButtonCCs, min: 0, max: 1, input_type: toggle }
      B3: { name: "button3", remotable: "Filter Env Invert", key: ButtonCCs, min: 0, max: 1, input_type: toggle }

    encoders:
      E1: { name: "encoder1", remotable: "Filter Freq", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E2: { name: "encoder2", remotable: "Filter Res", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E3: { name: "encoder3", remotable: "Filter Type", key: EncoderCCs, min: 0, max: 4, input_type: value }
      E4: { name: "encoder4", remotable: "Filter Kbd Track", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E5: { name: "encoder5", remotable: "Filter2 Freq", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E6: { name: "encoder6", remotable: "Filter2 Res", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E7: { name: "encoder7", remotable: "Filter Env Amount", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E8: { name: "encoder8", remotable: "Filter Env Vel Amount", key: EncoderCCs, min: -64, max: 63, input_type: value }

  FilterEnvelope:
    encoders:
      E1: { name: "encoder1", remotable: "Filter Env Attack", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E2: { name: "encoder2", remotable: "Filter Env Decay", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E3: { name: "encoder3", remotable: "Filter Env Sustain", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E4: { name: "encoder4", remotable: "Filter Env Release", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E5: { name: "encoder5", remotable: "Filter Env Amount", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E6: { name: "encoder6", remotable: "Filter Env Invert", key: EncoderCCs, min: 0, max: 1, input_type: toggle }

  AmpEnvelope:
    encoders:
      E1: { name: "encoder1", remotable: "Amp Env Attack", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E2: { name: "encoder2", remotable: "Amp Env Decay", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E3: { name: "encoder3", remotable: "Amp Env Sustain", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E4: { name: "encoder4", remotable: "Amp Env Release", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E5: { name: "encoder5", remotable: "Amp Vel Amount", key: EncoderCCs, min: -64, max: 63, input_type: value }
      E6: { name: "encoder6", remotable: "Master Level", key: EncoderCCs, min: 0, max: 127, input_type: value }

  Modulation:
    buttons:
      B1: { name: "button1", remotable: "Mod Env Invert", key: ButtonCCs, min: 0, max: 1, input_type: toggle }
      B2: { name: "button2", remotable: "LFO Sync Enable", key: ButtonCCs, min: 0, max: 1, input_type: toggle }

    encoders:
      E1: { name: "encoder1", remotable: "LFO1 Rate", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E2: { name: "encoder2", remotable: "LFO1 Amount", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E3: { name: "encoder3", remotable: "LFO1 Wave", key: EncoderCCs, min: 0, max: 5, input_type: value }
      E4: { name: "encoder4", remotable: "LFO1 Dest", key: EncoderCCs, min: 0, max: 5, input_type: value }
      E5: { name: "encoder5", remotable: "LFO2 Rate", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E6: { name: "encoder6", remotable: "LFO2 Amount", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E7: { name: "encoder7", remotable: "LFO2 Delay", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E8: { name: "encoder8", remotable: "LFO2 Dest", key: EncoderCCs, min: 0, max: 3, input_type: value }

  Performance:
    buttons:
      B1: { name: "button1", remotable: "Key Mode", key: ButtonCCs, min: 0, max: 1, input_type: toggle }
      B2: { name: "button2", remotable: "Low Bandwidth On/Off", key: ButtonCCs, min: 0, max: 1, input_type: toggle }

    encoders:
      E1: { name: "encoder1", remotable: "Portamento", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E2: { name: "encoder2", remotable: "Polyphony", key: EncoderCCs, min: 1, max: 99, input_type: value }
      E3: { name: "encoder3", remotable: "Pitch Bend Range", key: EncoderCCs, min: 0, max: 24, input_type: value }
      E4: { name: "encoder4", remotable: "FM Amount", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E5: { name: "encoder5", remotable: "Noise Level", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E6: { name: "encoder6", remotable: "Noise Color", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E7: { name: "encoder7", remotable: "Noise Decay", key: EncoderCCs, min: 0, max: 127, input_type: value }
      E8: { name: "encoder8", remotable: "Ext Mod Select", key: EncoderCCs, min: 0, max: 2, input_type: value }